what: >-
  Introduced: commit an explicit changeset to HEAD and merge the same delta into the
  frozen working tree, so compatible unselected edits and incoming content both survive;
  only the difference from the new HEAD stays pending. Missing author fields are read from
  the client's git config and recorded for replay.
pointers:
  - core/schema/workspace_commit.go:workspaceSchema.withCommit
code: |
  Workspace.withCommit(changes, message, date, author?)
    author missing → read client git config; re-select with explicit identity
    frozen = freeze(receiver)                            # snapshot if live
    uncommitted = frozen.git.uncommitted
    working = (HEAD.tree(discardGitDir) + uncommitted).changes(from: changes.Before)
    merged = working.withChangeset(changes, FAIL)          # general merge: git add -A of the whole base
    C1 = frozen.git.head.withCommit(changes, …)          # see GitRef.withCommit
    W1 = C1.asWorkspace
    remaining = merged.After.changes(from: W1 root)
    return W1.withChanges(remaining) + workspace metadata
