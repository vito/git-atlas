verified_at: null
what: >-
  refJoin copies each ref's closure with pack-objects via a transient alternate, one ref
  at a time under its mutex; each pack excludes the history of the refs already joined,
  so a fork and its upstream share one copy of their common history. Any pack failure
  falls back to #14576's fetch, which keeps negotiating from the joined commits
  (joinGitObjects). Mount callbacks now receive the mount's ctx, so a remote ref's copy
  nests under its mirror-lock span.
pointers:
  - core/git.go:refJoin
  - {at: core/git.go:joinGitObjects, note: new}
  - {at: core/git_pack_copy.go:packGitClosure, note: new}
code: |
  GitRef.log(limit, paths, base)
    unfiltered: fetch limit generations; uneven shallow boundary → retry with full history
    owned shallow storage: answer above the boundary; deeper → __hydrateRepository
    paths/base: ref.mount(depth 0) → git log …    # remote: --unshallow the mirror, under its lock
  GitRef.commonAncestor(other) / contains(other)
    mountRefs(a, b):
      same repository → mount once
      local refs → alternates view over the mounted object stores (no fetch)
      owned shallow child vs its anchor/descendants → the child's store
      complete local donor holding every commit → alternates view (no fetch, no lock)
      owned child vs its exact remote parent → the child's objects
      else refJoin: tmp repo; per ref (each under its own mirror lock):
        pack-objects its closure ^ <joined SHAs> via alternate (fallback: fetch --negotiation-tip=<joined SHAs>)
    git merge-base [--is-ancestor]
    contains, history incomplete → containsWithFullHistory: fetch --unshallow --negotiation-tip=<joined SHAs>
