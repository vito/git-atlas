what: >-
  Proposed: bundle creation from a remote copies the targets and base out of the mirror
  with one packGitClosure (one update-ref transaction), then runs git bundle create
  unlocked. An annotated tag still comes from origin, but its peeled commit's history is
  pack-copied from the mirror first under a temporary ref, so the origin fetch negotiates
  against it and transfers only the tag object; the temporary refs are deleted before
  bundling. The import side has the same shape as #14576's; the PR notes that whichever
  merges second keeps #14576's copy body and instrumentation.
