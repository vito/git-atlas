code: |
  GitRepository.bundle(refs, base)                     # names resolved per session
    __bundleFile(pinned refs, base)                    # persisted
      mount source with targets + base (remote: mirror lock + fetch)
        local source: scratch borrows objects via alternates (no fetch)
        remote source: pack-objects closure of targets + base + annotated tags' peeled commits
          via alternate, one update-ref (fallback: fetch)
          annotated tag: fetch only the tag object from origin (haves = copied history); drop temp refs
        release lock
        git bundle create (detached HEAD preserved)       # unlocked
  GitRepository.withBundle(bundle, prerequisiteRef)
    __withBundleDirectory → DirectoryGitBundleImportLazy   # lazy, persisted producer
      mount source with prerequisites (remote: mirror lock + depth-0 fetch)
        new bare repo; copy prerequisites (copyGitBundlePrerequisites)
      release source / mirror lock
      bundle verify; fetch bundle refs; pack-refs; write remotes   # unlocked
  GitBundle.validate / refs / prerequisiteSHAs: parse and verify the header
