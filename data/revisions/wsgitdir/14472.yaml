what: >-
  Saved under its own recipe kind so it can be rebuilt (and older engines refuse rather
  than rebuild a tree without .git).
pointers:
  - core/git.go:persistedDirectoryLazyKindGitFullCheckout
code: |
  WorkspaceGit.directory = git.__checkout.directory('.git')
  WorkspaceGit.__checkout = git.head.__fullCheckout           # keyed by the resolved ref
  GitRef.__fullCheckout = Backend.Tree(keep .git, depth 0)   # recipe kind gitFullCheckout
    remote: lock; mirror fetch --unshallow; checkout (see GitRef.tree)
    local:  new snapshot: init; fetch the whole history from the mount; checkout
    finish: read-tree HEAD (index without stat data); mtime = 1s
