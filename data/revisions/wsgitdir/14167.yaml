source: code
verified_at: null
what: >-
  Remote HEADs copy their full history out of the mirror with pack-objects (fallback:
  fetch) and finish the checkout after releasing the lock. Local HEADs keep #14576's COW
  paths.
effect: "1.16 s vs 3.29 s lock hold for a full-history copy of dagger/dagger."
pointers:
  - core/git_remote.go:RemoteGitRef.Tree
  - core/git.go:copyGitCheckout
code: |
  WorkspaceGit.directory = git.__checkout.directory('.git')
  WorkspaceGit.__checkout = git.head.__fullCheckout           # keyed by the resolved ref
  GitRef.__fullCheckout = Backend.Tree(keep .git, depth 0)   # recipe kind gitFullCheckout
    remote: lock only for mirror fetch --unshallow + pack-objects copy-out; checkout after unlock (see GitRef.tree)
    local:  ① COW delta on base checkout ② COW wipe (checkout -f, no fetch) ③ fetch the whole history
    finish: read-tree HEAD (index without stat data); mtime = 1s (skips inherited .git/objects)
