source: pr-description
verified_at: null
what: >-
  Live workspaces exported onto their own checkout write only their overlay (sparse, no
  capture, no approval). Omitted path means the caller's local workspace root. Different
  baselines use conflict-checked Git integration, capturing live sources automatically;
  the source's own owned base is reused when it already is the destination's HEAD.
pointers:
  - core/schema/workspace_export.go:workspaceSchema.export
  - core/schema/workspace_export.go:workspaceExportCapturedBase
code: |
  Workspace.export(path, from)
    path empty → caller's local workspace root
    live overlay onto its own checkout → exportOverlay (sparse writes; no capture)
    freeze source (and from)
    metadata, bundle = CaptureGit(path)                  # destination, untracked dropped
    destination = reuse source's owned base if it is the captured HEAD (__workspaceExportBaseReady)
      else rebuild from capture (git(url).withBundle(…).ref(HEAD).asWorkspace)
    dir = source.__saveDirectory(destination, from, committer)   # NotReplayable
      COW of destination git.__checkout
      fetch source HEAD; snapshot both sides' dirt; cherry-pick integrate; 2-parent transport commit
    bundle = dir.asGit.bundle(refs: [HEAD], base: destination HEAD)
    client ApplyBundle(bundle, expected checkout-state digest)
