code: |
  GitRef.withCommit(changes, message, date, author…)
    dir = __withCommitDirectory(args) → DirectoryGitCommitLazy   # saved recipe
      same-base provenance (Before = tree(discardGitDir) of this SHA, same repo recipe)?
        remote parent: storage = ref(SHA).__nativeCommitBase(depth 1)   # lock only for the pack-objects copy
          (depth 0: approved host donor PackCommit first, else the remote)
        native: COW child of repo storage; scratch bare repo, objects via alternate
          read-tree; stage only changed paths (sparse); write-tree; commit-tree
          copy new objects only; publish branch / detached HEAD
      else, or any failure (reason recorded: git.native.fallback[…]):
      tree = ref.tree(discardGitDir: true)
      applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree
      base = ref.asWorkspace.git.__checkout                  # local HEAD: COW delta / wipe
      COW child of base: applyContent; stage; git commit (hooks off)
    repo = __withCommitRepository: withContents(dir) + CheckoutBase{Parent, CommitSHA, Tree} + HistorySource + Upstream
    return repo.head
