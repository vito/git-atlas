what: >-
  Proposed: hold the mirror lock only to update the mirror and copy objects out. A
  full-history (depth 0) copy uses pack-objects in the checkout with the mirror as a
  transient alternate (reproducing the fetch's temp ref and tag auto-following; fallback:
  fetch); depth-limited copies keep fetching. Checkout, submodule clones (network) and
  timestamps run after the unlock, in the private copy. Adds 'waiting for / holding git
  mirror lock' spans and a wcprof git.mirror.locked op. Based on main: finishGitCheckout
  has no reuse-mode parameter there, unlike #14576.
effect: >-
  Full-history copy out of a warm dagger/dagger mirror: 1.16 s instead of 3.29 s of lock
  hold (median of 7).
pointers:
  - at: core/git_remote.go:RemoteGitRef.Tree
    note: branch
  - at: core/git.go:fetchGitCheckout
    note: branch
  - core/git.go:copyGitCheckout
  - core/git.go:packGitCheckout
  - at: core/git_pack_copy.go:packGitObjects
    note: new, branch
code: |
  GitRef.tree(discardGitDir, depth=1, includeTags)            # GitCommit.tree takes the same route
    if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)
    if keep .git, depth 0, no tags: return GitRef.__fullCheckout
      (saved under its own recipe kind: gitFullCheckout)
    dir = DirectoryGitTreeLazy{ref, discard, depth, includeTags}   # built on first read, persisted
    remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes]), set after materialization

  RemoteGitRef.Tree(…)
    setup auth/known hosts/DNS outside the lock (submodules need them later)
    lock git-remote::<url>                                    # held only to update the mirror and copy out
      mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip
      (depth dropped once the mirror is complete: mirrorFetchDepth)
      (automatic maintenance runs synchronously, inside the lock)
      copy out: depth 0 → pack-objects --revs via alternate + followed tags (fallback: fetch); depth N → fetch file://mirror
    unlock → checkout; submodule update --init --recursive; [rm .git]; mtime = 1s
    spans: waiting for / holding git mirror lock; wcprof git.mirror.locked, git.copy[pack|fetch]

  LocalGitRef.Tree(…)
    mount repository snapshot read-only            # owned shallow: depth 1; deep reads hydrate first
    discard and CheckoutBase(parent; remote parents pin their tree) and SHA == CommitSHA (sole parent):
      incrementalTree: diff-tree parent SHA → COW child of parent's tree, write the delta only
    discard: new snapshot: init + alternates → mounted objects (no fetch); checkout; rm .git
    keep .git: new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout
