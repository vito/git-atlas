<svg viewBox='0 0 760 210' width='100%' font-family='sans-serif' font-size='11'><rect x='5' y='5' width='170' height='40' rx='8' fill='#1d2330'/><text x='90' y='29' text-anchor='middle' fill='#fff' font-weight='700'>LocalGitRef.Tree</text><text x='200' y='22' font-weight='700'>discardGitDir</text><rect x='200' y='30' width='170' height='34' rx='7' fill='#fff' stroke='#9aa3b5'/><text x='208' y='51'>① incremental (any ancestor)</text><rect x='385' y='30' width='175' height='34' rx='7' fill='#ffe3ee' stroke='#c2255c'/><text x='393' y='51'>② COW of retained checkout</text><rect x='575' y='30' width='175' height='34' rx='7' fill='#fde8e8' stroke='#d64545'/><text x='583' y='51'>③ full alternates checkout</text><path d='M370 47 H383 M560 47 H573' stroke='#d64545' stroke-width='2'/><text x='200' y='102' font-weight='700'>keep .git, depth ≤ 0</text><rect x='200' y='110' width='170' height='34' rx='7' fill='#ffe3ee' stroke='#c2255c'/><text x='208' y='131'>① COW delta on base checkout</text><rect x='385' y='110' width='175' height='34' rx='7' fill='#ffe3ee' stroke='#c2255c'/><text x='393' y='131'>② COW wipe: checkout -f</text><rect x='575' y='110' width='175' height='34' rx='7' fill='#fde8e8' stroke='#d64545'/><text x='583' y='131'>③ fetch whole history</text><path d='M370 127 H383 M560 127 H573' stroke='#d64545' stroke-width='2'/><text x='200' y='175' fill='#5b6475'>markers: git.tree.&lt;incremental|checkout|full&gt;[why] · git.checkout.&lt;delta|wipe|full&gt;[why]</text><text x='200' y='195' fill='#5b6475'>left to right: tried in order; any refusal or error falls through (nativeFallback)</text></svg>
