claim: >-
  #14167 was based on main. It splits doGitCheckout into fetchGitCheckout +
  finishGitCheckout(…, tmpref) while #14576 adds a gitCheckoutReuse parameter to
  finishGitCheckout; both rewrite importGitBundleInto's prerequisite copy (#14167's
  description already says the second to land keeps #14576's copy body and
  instrumentation); and both rewrite refJoin's per-ref fetch (#14576: --negotiation-tip of
  joined SHAs; #14167: packGitClosure with fetch fallback). A naive merge can drop the
  negotiation tips from refJoin's fallback fetch. Resolved as proposed: #14576 merged
  first and #14167 was rebased on it. Remote checkouts pass gitCheckoutFresh to the
  reuse-mode finishGitCheckout, bundle import keeps copyGitBundlePrerequisites and its
  phases (only the post-unlock tail moved to finishGitBundleImport), and
  joinGitObjects' fallback fetch keeps --negotiation-tip for the joined commits.
proposal: >-
  Land #14576 first, rebase #14167 on it: keep the reuse-mode finishGitCheckout and make
  #14167's copy phase one more 'objects provider'; keep negotiation tips on refJoin's
  fallback fetch.
