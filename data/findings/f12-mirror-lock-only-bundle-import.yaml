kind: lag
title: "Mirror lock: push preparation and full-history reads still hold it throughout"
status: open
discovered_in: 14576
prs: [14167, 14576]
size: M
risk: medium
apis: [GitRef.push, GitRef.log, GitRef.contains, GitRef.tree, GitRef.withCommit, GitRepository.bundle]
claim: >-
  Before #14167, remote tree checkouts (including submodule clones over the network),
  commit-base promotions, bundle creation, push preparation and full-history logs all
  held git-remote::<url> for their whole operation, and #14576 narrowed bundle import
  only. #14167 narrows checkouts, promotions and bundle creation to 'update the mirror +
  copy out' and adds the 'holding git mirror lock' span and git.mirror.locked op to every
  holder; push preparation still fetches into its scratch repo under the lock, and
  path/base-filtered logs (and same-repository contains/commonAncestor) unshallow the
  mirror and run git against it while holding it.
proposal: >-
  Apply the same 'update + copy out, then unlock' split to push preparation (copy with
  copyGitObjects, push from the private copy); for log/contains, consider reading from a
  pack-copied private repository when the read is expected to be long.
