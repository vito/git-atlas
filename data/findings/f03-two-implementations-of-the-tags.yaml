kind: dup
title: Two implementations of 'the tags a fetch would have auto-followed'
status: open
discovered_in: 14167
prs: [14167, 14576]
size: S
risk: medium
apis: [GitRef.tree, WorkspaceGit.directory]
claim: >-
  #14576's cowGitCheckoutTags lists tags with for-each-ref --merged=<sha> (a commit walk)
  and refuses any tag that does not peel to a commit; #14167's gitTagCandidates /
  gitFollowedTags list every tag, check the destination for the peeled object, refuse
  tags of tags, and pack annotated tag objects. Both then write a refs/dagger.tmp/<id>
  ref plus the tags in one update-ref --stdin. Both are on main now; they will disagree
  on tags of trees/blobs and tags of tags, and both re-implement doGitCheckout's fetch
  semantics.
proposal: >-
  One followedTags(dest, source, head) with one documented refusal set, shared by the COW
  wipe/delta paths and the pack copy-out.
pointers:
  - at: core/git_local_cow.go:cowGitCheckoutTags@e119a8d
    note: tmpref + update-ref --stdin
  - core/git_local_cow.go:cowGitCheckout@e119a8d
  - core/git.go:gitTagCandidates@e119a8d
  - core/git.go:gitFollowedTags@e119a8d
  - core/git.go:packGitCheckout@e119a8d
