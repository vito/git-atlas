claim: >-
  The same technique (pack-objects --revs in the destination, source objects via
  GIT_ALTERNATE_OBJECT_DIRECTORIES, GIT_NO_REPLACE_OBJECTS, GIT_NO_LAZY_FETCH, verify,
  fallback to fetch) exists as packRemoteCommitBaseDepth (#14400),
  packGitBundlePrerequisites (#14576, adds --use-bitmap-index), and #14167's
  packGitObjects/packGitClosure, which #14167 also routes the commit-base promotion
  through. Flags and refusal checks differ (bitmap use, shallow source/destination guards,
  object-format checks).
proposal: >-
  Adopt #14167's git_pack_copy.go as the single helper (with an opt-in bitmap flag), and
  port #14576's bundle prerequisites to it.
