apis: [GitRepository.withBundle, GitRepository.bundle, GitRef.withCommit, GitRef.tree]
claim: >-
  The same technique (pack-objects --revs in the destination, source objects via
  GIT_ALTERNATE_OBJECT_DIRECTORIES, GIT_NO_REPLACE_OBJECTS, GIT_NO_LAZY_FETCH, verify,
  fallback to fetch) existed three times before #14167: packRemoteCommitBaseDepth
  (#14400), packGitBundlePrerequisites (#14576, adds --use-bitmap-index), and #14167's
  packGitObjects/packGitClosure. #14167 routes the commit-base promotion
  (copyRemoteCommitBase) through packGitObjects, so two remain on main:
  packGitBundlePrerequisites keeps its own env, flags and fallback, while git_pack_copy.go
  adds shallow source/destination and object-format guards and copyGitObjects' git.copy
  instrumentation.
proposal: >-
  Port the bundle prerequisites copy to git_pack_copy.go (newGitPackCopy + copyGitObjects)
  with an opt-in bitmap flag.
