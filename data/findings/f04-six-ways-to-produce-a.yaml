size: L
risk: medium-high
apis: [GitRef.tree, WorkspaceGit.directory, Workspace.withReset]
claim: >-
  doGitCheckout (fetch), doLocalGitTreeCheckout (alternates), incrementalTree,
  contentsCheckoutTree, cowTree delta, cowTree wipe, plus #14167's
  copyGitCheckout/packGitCheckout. They share
  planIncrementalGitCheckout/applyIncrementalGitCheckout and finishGitCheckout, but each
  re-validates layout (nativeCommitGitDir vs retainedCheckoutHead vs nativeGitDir), each
  fixes the snapshot root differently (setSnapshotRootInfo vs finishRetainedCheckoutTree),
  and source trees vs retained checkouts record different marker families (git.tree.* vs
  git.checkout.*).
proposal: >-
  Model a checkout as (base snapshot, object source, worktree writer, metadata writer)
  chosen by one planner that emits one marker; keep the existing functions as strategies.
