f = remote.Lookup(name)                # strict: branch | tag | full SHA","  owned storage: not found / SHA absent (HasCommit) → Upstream.ref(name)   # remote's own GitRef","  write lock entry","  return select __resolvedRef(name, SHA)    # persisted; digest: url + SHA + auth handles","latest(version): SelectGitRefWithVersionQuery → matching tags, then branches; lock stores ref + commit"],"source":"pr-description","sha":"e2af618"},{"pr":"14525","where":[{"t":"core/git_remote.go:ContextWithLiveGitRemote","u":"https://github.com/dagger/dagger/blob/86035e6b7f6de4665ce7d6c118b559df1a0abb3f/core/git_remote.go#L198"}],"what":"noLock only skipped the lockfile; three per-session caches could still answer, so main kept resolving to the commit seen at the session's first lookup. With noLock, the call gets a fresh cache key (except full SHAs, which cannot change) and the repository listing is re-run and replaced in place.","code":["GitRepository.ref(name, noLock)            # head · branch · tag · commit share this path","  # cache: per client when the lock is consulted; full SHAs shared; noLock → fresh key per call","  name~N / name^N → resolve base as below, then WalkRevision (remote: fetch walk depth, retry full)","  noLock: skip lock read and write; mark context live","  pin = workspace lock (git.ref, host/path identity, name)? → use the pinned SHA","  remote = repo.LoadRemote()               # remote: ls-remote, cached per session (live: re-listed)","                                            # local: ls-remote file://<gitdir>","  abbreviated SHA → ResolveShortSHA (fetched objects only)","  ref = remote.Lookup(name)                # strict: branch | tag | full SHA","  owned storage: not found / SHA absent (HasCommit) → Upstream.ref(name)   # remote's own GitRef","  write lock entry","  return select __resolvedRef(name, SHA)    # persisted; digest: url + SHA + auth handles","latest(version): SelectGitRefWithVersionQuery → matching tags, then branches; lock stores ref + commit"],"source":"pr-description","notes":"See also: dagql PerCallWhen.","sha":"86035e6"},{"pr":"base","where":[{"t":"core/schema/git.go:gitSchema.ref","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/git.go#L1043"},{"t":"core/git.go:GitRepository.LoadRemote","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git.go#L225"},{"t":"core/git_remote.go:RemoteGitRepository.Remote","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git_remote.go#L65"}],"what":"Every named lookup goes through one path: consult the workspace lockfile pin, otherwise list the remote (ls-remote, cached per session since #11366; local storage lists itself over file://), look the name up strictly, write the pin, and build the GitRef with a content digest of url + SHA.","code":["GitRepository.ref(name)                    # head · branch · tag · commit share this path","  pin = workspace lock (git.ref, repo url, name)? → use the pinned SHA","  remote = repo.LoadRemote()               # remote: ls-remote, cached per session","                                            # local: ls-remote file://<gitdir>","  ref = remote.Lookup(name)                # strict: branch | tag | full SHA","  write lock entry","  return gitRefResult(ref)                 # content digest: url + SHA + discard flag","latest(): greatest semver tag, else HEAD"],"source":"pr-description","sha":"5ddd194"}]},"snapshot":{"title":"Freezing a workspace (Workspace.snapshot / freeze)","short":"snapshot","tabs":[{"pr":"14147","where":[{"t":"core/schema/workspace_checkpoint.go:snapshot","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_checkpoint.go#L34"},{"t":"core/schema/workspace_checkpoint.go:freeze","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_checkpoint.go#L54"},{"t":"core/schema/workspace_checkpoint.go:checkpointClientLocal","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_checkpoint.go#L135"},{"t":"core/schema/workspace_checkpoint.go:checkpointCapturedGitCompositionWithBase","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_checkpoint.go#L272"}],"what":"Introduced: capture Git history and approved pending edits as a stable value. A live host workspace is captured by the client (CaptureGit) and rebuilt as a recipe over the remote (plus a bundle for unpushed commits); without a remote URL, from Host.__gitDir (session-local). Git-ref workspaces are pinned by SHA.","code":["Workspace.snapshot / freeze","  live host workspace: CaptureGit (client): HEAD, remote URL, unpushed bundle, worktree commit","    untracked files → interactive approval","    repo = git(url) [.withBundle(bundle, prerequisiteRef)]      # no remote: Host.__gitDir","    W = repo.ref(HEAD sha).asWorkspace","      .withChanges(worktree.tree(discard, depth 1, no tags).changes(from: HEAD.tree(…)))","  git-ref workspace: pin the ref by SHA; keep the overlay","  nothing capturable: return the workspace unchanged"],"source":"pr-description","sha":"40a74d0"},{"pr":"14274","where":[{"t":"core/schema/workspace_checkpoint.go:checkpointSSHAuthArgs","u":"https://github.com/dagger/dagger/blob/4b0a126454c390d71fa2f9abef7cf0f93705a629/core/schema/workspace_checkpoint.go#L474"}],"what":"Private SSH repos with no SSH_AUTH_SOCK: reuse push's SSH preparation to start a session-managed agent for the owner's checkout capture, and pass an identity-scoped socket explicitly (keeping host socket paths out of the portable recipe).","code":["Workspace.snapshot / freeze","  live host workspace: CaptureGit (client): HEAD, remote URL, unpushed bundle, worktree commit","    untracked files → interactive approval","    SSH origin, no agent → PrepareGitSSHAuth; pass a scoped socket to git(url)","    repo = git(url) [.withBundle(bundle, prerequisiteRef)]      # no remote: Host.__gitDir","    W = repo.ref(HEAD sha).asWorkspace","      .withChanges(worktree.tree(discard, depth 1, no tags).changes(from: HEAD.tree(…)))","  git-ref workspace: pin the ref by SHA; keep the overlay","  nothing capturable: return the workspace unchanged"],"source":"pr-description","sha":"4b0a126"},{"pr":"14401","where":[{"t":"core/schema/workspace_checkpoint.go:registerCheckpointHostHistory","u":"https://github.com/dagger/dagger/blob/913c0faee9fff2341cdacebe7df6a8d4c183d74f/core/schema/workspace_checkpoint.go#L247"}],"what":"A clean capture sitting on a remote ref registers the owner's checkout as an approved history donor (no IO, never fails the capture), so later deep-history hydration can come from the client instead of the remote.","code":["Workspace.snapshot / freeze","  live host workspace: CaptureGit (client): HEAD, remote URL, unpushed bundle, worktree commit","    untracked files → interactive approval","    SSH origin, no agent → PrepareGitSSHAuth; pass a scoped socket to git(url)","    repo = git(url) [.withBundle(bundle, prerequisiteRef)]      # no remote: Host.__gitDir","    clean capture on a remote ref → register approved host history donor","    W = repo.ref(HEAD sha).asWorkspace","      .withChanges(worktree.tree(discard, depth 1, no tags).changes(from: HEAD.tree(…)))","  git-ref workspace: pin the ref by SHA; keep the overlay","  nothing capturable: return the workspace unchanged"],"source":"pr-description","sha":"913c0fa"},{"pr":"14511","where":[{"t":"core/schema/workspace_checkpoint.go:checkpointCapturedGitRemotes","u":"https://github.com/dagger/dagger/blob/195b09187512b7e114f47048c773310701af87a7/core/schema/workspace_checkpoint.go#L519"}],"what":"Freezing keeps the checkout's named remotes and the upstream its branch follows (__withRemoteSelection), so defaultRemote() still works on the frozen value.","code":["Workspace.snapshot / freeze","  live host workspace: CaptureGit (client): HEAD, remote URL, unpushed bundle, worktree commit","    untracked files → interactive approval","    SSH origin, no agent → PrepareGitSSHAuth; pass a scoped socket to git(url)","    repo = git(url) [.withBundle(bundle, prerequisiteRef)]      # no remote: Host.__gitDir","    clean capture on a remote ref → register approved host history donor","    repo = repo.__withRemoteSelection(captured remotes, upstream)","    W = repo.ref(HEAD sha).asWorkspace","      .withChanges(worktree.tree(discard, depth 1, no tags).changes(from: HEAD.tree(…)))","  git-ref workspace: pin the ref by SHA; keep the overlay","  nothing capturable: return the workspace unchanged"],"source":"pr-description","sha":"195b091"},{"pr":"14531","where":[{"t":"core/schema/workspace_checkpoint.go:checkpointGitRef","u":"https://github.com/dagger/dagger/blob/d84226110e84281f333d9c0dfefdc8bba095538b/core/schema/workspace_checkpoint.go#L281"},{"t":"core/schema/workspace_checkpoint.go:checkpointOverlay","u":"https://github.com/dagger/dagger/blob/d84226110e84281f333d9c0dfefdc8bba095538b/core/schema/workspace_checkpoint.go#L736"}],"what":"Freezing a Git workspace re-recorded its whole pending overlay as an inlined patch with no limit (a 184 MB test binary became a 129 MB span attribute and an unrestorable trace). Git workspaces are now frozen as-is: named refs are re-selected by SHA, the overlay is kept by reference, and host overlays use bounded patches (over 16 MiB or binary → raw changeset).","code":["Workspace.snapshot / freeze","  live host workspace: CaptureGit (client): HEAD, remote URL, unpushed bundle, worktree commit","    untracked files → interactive approval","    SSH origin, no agent → PrepareGitSSHAuth; pass a scoped socket to git(url)","    repo = git(url) [.withBundle(bundle, prerequisiteRef)]      # no remote: Host.__gitDir","    clean capture on a remote ref → register approved host history donor","    repo = repo.__withRemoteSelection(captured remotes, upstream)","    W = repo.ref(HEAD sha).asWorkspace","      .withChanges(worktree.tree(discard, depth 1, no tags).changes(from: HEAD.tree(…)))","    host overlay edits → bounded patch (≤ 16 MiB, no binaries) else raw changeset","  git-ref workspace: re-select by SHA; overlay kept by reference (no re-rendered patch)","  nothing capturable: return the workspace unchanged"],"source":"pr-description","sha":"d842261"}]},"tree":{"title":"Tree materialization (GitRef.tree / GitCommit.tree)","short":"tree / checkout","tabs":[{"pr":"14097","where":[{"t":"core/git_remote.go:RemoteGitRepository.setup","u":"https://github.com/dagger/dagger/blob/f5101501bb4de4db1400801d2bc84758a6b25e12/core/git_remote.go#L209"}],"what":"git's detached automatic maintenance could repack the mirror (rewriting its shallow file) while the next fetch used it: 'shallow file has changed since we read it'. gc.autoDetach and maintenance.autoDetach are false, so maintenance finishes inside the lock and mount.","code":["GitRef.tree(discardGitDir, depth=1, includeTags)            # GitCommit.tree takes the same route","  dir = ref.Backend.Tree(discard, depth, includeTags)        # eager, in the resolver","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name])","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (automatic maintenance runs synchronously, inside the lock)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only","  new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout; [rm .git]"],"source":"code","verified":"2026-10-09","sha":"f510150"},{"pr":"14147","where":[{"t":"core/schema/git.go:gitSchema.tree","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L2036"},{"t":"core/schema/git.go:pinnedGitTree","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L2088"},{"t":"core/schema/git.go:gitSchema.fullCheckout","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L2015"},{"t":"core/schema/git.go:gitSchema.commitTree","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L2171"}],"what":"Trees without .git are content-addressed independently of the ref name, so a named ref is re-selected by its SHA first (pinned recipe). Full-history trees with .git are routed through a shared GitRef.__fullCheckout selector, which WorkspaceGit.__checkout also uses (ab34fda). Registered remotes are written into checkouts and are part of the content digest (520b4f3).","code":["GitRef.tree(discardGitDir, depth=1, includeTags)","  if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)","  if keep .git, depth 0, no tags: return GitRef.__fullCheckout","  dir = ref.Backend.Tree(discard, depth, includeTags)        # eager, in the resolver","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes])","","GitCommit.tree(discardGitDir, depth=1, includeTags)","  if no .git: return repo.ref(SHA).tree(…)                   # shares GitRef.tree's pinned recipe","  else GitCommit.Tree, eager (never __fullCheckout): prefetch the commit; Backend.Tree(…)","  remote: same contentDigest","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (automatic maintenance runs synchronously, inside the lock)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only","  new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout; [rm .git]"],"source":"pr-description","verified":"2026-10-09","sha":"40a74d0"},{"pr":"14167","where":[{"t":"core/git_remote.go:RemoteGitRef.Tree","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git_remote.go#L866","n":"branch"},{"t":"core/git.go:fetchGitCheckout","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git.go#L1391","n":"branch"},{"t":"core/git.go:copyGitCheckout","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git.go#L1422"},{"t":"core/git.go:packGitCheckout","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git.go#L1450"},{"t":"core/git.go:gitTagCandidates","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git.go#L1504","n":"new, branch"},{"t":"core/git_pack_copy.go:packGitObjects","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git_pack_copy.go#L57","n":"new, branch"}],"what":"Proposed: hold the mirror lock only to update the mirror and copy objects out. A full-history (depth 0) copy uses pack-objects in the checkout with the mirror as a transient alternate (reproducing the fetch's temp ref and tag auto-following; fallback: fetch); it lists the mirror's tags before packing, so a tag of a tag falls back to the fetch without first packing a history it would discard. Depth-limited copies keep fetching. Checkout, submodule clones (network) and timestamps run after the unlock, in the private copy. Adds 'waiting for / holding git mirror lock' spans (the holding span is passthrough, and the mirror fetch and copy nest under it) and a wcprof git.mirror.locked op. Based on main: finishGitCheckout has no reuse-mode parameter there, unlike #14576.","effect":"Full-history copy out of a warm dagger/dagger mirror: 1.16 s instead of 3.29 s of lock hold (median of 7).","code":["GitRef.tree(discardGitDir, depth=1, includeTags)","  if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)","  if keep .git, depth 0, no tags: return GitRef.__fullCheckout","    (saved under its own recipe kind: gitFullCheckout)","  dir = DirectoryGitTreeLazy{ref, discard, depth, includeTags}   # built on first read, persisted","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes]), set after materialization","","GitCommit.tree(discardGitDir, depth=1, includeTags)","  if no .git: return repo.ref(SHA).tree(…)                   # shares GitRef.tree's pinned recipe","  else dir = DirectoryGitCommitTreeLazy{commit, …}            # never __fullCheckout","    on read: GitCommit.Tree: prefetch the commit; Backend.Tree(…)","  remote: same contentDigest, on the lazy","","RemoteGitRef.Tree(…)","  setup auth/known hosts/DNS outside the lock (submodules need them later)","  lock git-remote::<url>                                    # held only to update the mirror and copy out","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (depth dropped once the mirror is complete: mirrorFetchDepth)","    (automatic maintenance runs synchronously, inside the lock)","    copy out: depth 0 → list mirror tags (tag of a tag → fetch); pack-objects --revs via alternate","      + followed tags (fallback: fetch); depth N → fetch file://mirror","  unlock → checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","  spans: waiting for / holding git mirror lock (fetch + copy nest under it); wcprof git.mirror.locked, git.copy[pack|fetch]","","LocalGitRef.Tree(…)","  mount repository snapshot read-only            # owned shallow: depth 1; deep reads hydrate first","  discard and CheckoutBase(parent; remote parents pin their tree) and SHA == CommitSHA (sole parent):","    incrementalTree: diff-tree parent SHA → COW child of parent's tree, write the delta only","  discard: new snapshot: init + alternates → mounted objects (no fetch); checkout; rm .git","  keep .git: new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout"],"source":"code","verified":"2026-10-09","sha":"655c54e"},{"pr":"14170","where":[{"t":"core/git_remote.go:gitRefsToFetch","u":"https://github.com/dagger/dagger/blob/245a7a2ee572480ee13d819b32cb2e198bd8ef4c/core/git_remote.go#L314"},{"t":"core/git_remote.go:fetchedGitRef","u":"https://github.com/dagger/dagger/blob/245a7a2ee572480ee13d819b32cb2e198bd8ef4c/core/git_remote.go#L530"}],"what":"FETCH_HEAD is not a negotiation tip, so each fetch into the mirror claimed to have nothing and re-received shared history. Each fetched SHA is now pinned as refs/dagger.fetched/<sha> (also for commits fetched by older engines), so later fetches advertise it as 'have'.","code":["GitRef.tree(discardGitDir, depth=1, includeTags)            # GitCommit.tree takes the same route","  dir = ref.Backend.Tree(discard, depth, includeTags)        # eager, in the resolver","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name])","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only","  new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout; [rm .git]"],"source":"code","verified":"2026-10-09","sha":"245a7a2"},{"pr":"14224","where":[{"t":"core/schema/git.go:gitSchema.tree","u":"https://github.com/dagger/dagger/blob/9282dfa1271e1907a3e3af6dc2114df652ca2b62/core/schema/git.go#L2105"},{"t":"core/git.go:DirectoryGitTreeLazy","u":"https://github.com/dagger/dagger/blob/9282dfa1271e1907a3e3af6dc2114df652ca2b62/core/git.go#L1487"},{"t":"core/git.go:DirectoryGitCommitTreeLazy","u":"https://github.com/dagger/dagger/blob/9282dfa1271e1907a3e3af6dc2114df652ca2b62/core/git.go#L1613"},{"t":"core/git.go:deferGitTreeContentDigest","u":"https://github.com/dagger/dagger/blob/9282dfa1271e1907a3e3af6dc2114df652ca2b62/core/git.go#L1525"}],"what":"The tree becomes a lazy, persisted producer (DirectoryGitTreeLazy): nothing is checked out until the directory is read, and its recipe can rebuild it after a restart or on another engine. The remote content digest is published only after materialization, so credential scopes never alias before a fetch succeeds (26d7160).","code":["GitRef.tree(discardGitDir, depth=1, includeTags)","  if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)","  if keep .git, depth 0, no tags: return GitRef.__fullCheckout","  dir = DirectoryGitTreeLazy{ref, discard, depth, includeTags}   # built on first read, persisted","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes]), set after materialization","","GitCommit.tree(discardGitDir, depth=1, includeTags)","  if no .git: return repo.ref(SHA).tree(…)                   # shares GitRef.tree's pinned recipe","  else dir = DirectoryGitCommitTreeLazy{commit, …}            # never __fullCheckout","    on read: GitCommit.Tree: prefetch the commit; Backend.Tree(…)","  remote: same contentDigest, on the lazy","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (automatic maintenance runs synchronously, inside the lock)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only","  new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout; [rm .git]"],"source":"code","verified":"2026-10-09","sha":"9282dfa"},{"pr":"14395","where":[{"t":"core/git_local.go:doLocalGitTreeCheckout","u":"https://github.com/dagger/dagger/blob/a96196e9d8ba4a8ebc77bc31d7bbac188469e84b/core/git_local.go#L421"},{"t":"core/git.go:writeGitAlternates","u":"https://github.com/dagger/dagger/blob/a96196e9d8ba4a8ebc77bc31d7bbac188469e84b/core/git.go#L1628"},{"t":"core/git_remote.go:mirrorFetchDepth","u":"https://github.com/dagger/dagger/blob/a96196e9d8ba4a8ebc77bc31d7bbac188469e84b/core/git_remote.go#L579"}],"what":"Source-only trees of local repositories no longer fetch and repack history only to delete .git: the scratch checkout borrows the mounted objects through a temporary alternates file (44fea25). A depth limit is dropped once the mirror is complete, because shallow-fetching into a complete mirror adds boundaries a later full read must undo (7a6d27e).","code":["GitRef.tree(discardGitDir, depth=1, includeTags)","  if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)","  if keep .git, depth 0, no tags: return GitRef.__fullCheckout","  dir = DirectoryGitTreeLazy{ref, discard, depth, includeTags}   # built on first read, persisted","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes]), set after materialization","","GitCommit.tree(discardGitDir, depth=1, includeTags)","  if no .git: return repo.ref(SHA).tree(…)                   # shares GitRef.tree's pinned recipe","  else dir = DirectoryGitCommitTreeLazy{commit, …}            # never __fullCheckout","    on read: GitCommit.Tree: prefetch the commit; Backend.Tree(…)","  remote: same contentDigest, on the lazy","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (depth dropped once the mirror is complete: mirrorFetchDepth)","    (automatic maintenance runs synchronously, inside the lock)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only","  discard: new snapshot: init + alternates → mounted objects (no fetch); checkout; rm .git","  keep .git: new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout"],"source":"code","verified":"2026-10-09","sha":"a96196e"},{"pr":"14399","where":[{"t":"core/git_local_incremental.go:LocalGitRef.incrementalTree","u":"https://github.com/dagger/dagger/blob/2f9de2a0c9db28a0e166e9d09b56418bdeb1203a/core/git_local_incremental.go#L43"},{"t":"core/git_local_incremental.go:planIncrementalGitCheckout","u":"https://github.com/dagger/dagger/blob/2f9de2a0c9db28a0e166e9d09b56418bdeb1203a/core/git_local_incremental.go#L177"},{"t":"core/git_local.go:GitCheckoutBase","u":"https://github.com/dagger/dagger/blob/2f9de2a0c9db28a0e166e9d09b56418bdeb1203a/core/git_local.go#L32"}],"what":"A commit made by GitRef.withCommit on a local parent retains that parent's exact recipe (CheckoutBase); commits on remote parents record none, so they keep the full checkout. A source-only tree of exactly that commit is a COW child of the parent's canonical tree with only the diff-tree delta written. Gates: the parent must be local and the commit's sole raw parent; gitlink/.gitmodules/.gitattributes changes, unsafe paths, cold-parent chains and >64 overlay layers fall back to the full checkout.","effect":"Median Workspace.withCommit 3.18 s → 0.94 s, full cycle 4.47 s → 2.74 s (12k-file repo, three one-file scoped commits, vs. this PR's base after #14397; PR description).","code":["GitRef.tree(discardGitDir, depth=1, includeTags)","  if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)","  if keep .git, depth 0, no tags: return GitRef.__fullCheckout","  dir = DirectoryGitTreeLazy{ref, discard, depth, includeTags}   # built on first read, persisted","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes]), set after materialization","","GitCommit.tree(discardGitDir, depth=1, includeTags)","  if no .git: return repo.ref(SHA).tree(…)                   # shares GitRef.tree's pinned recipe","  else dir = DirectoryGitCommitTreeLazy{commit, …}            # never __fullCheckout","    on read: GitCommit.Tree: prefetch the commit; Backend.Tree(…)","  remote: same contentDigest, on the lazy","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (depth dropped once the mirror is complete: mirrorFetchDepth)","    (automatic maintenance runs synchronously, inside the lock)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only","  discard and CheckoutBase(local parent) and SHA == CommitSHA (sole parent):","    incrementalTree: diff-tree parent SHA → COW child of parent's tree, write the delta only","  discard: new snapshot: init + alternates → mounted objects (no fetch); checkout; rm .git","  keep .git: new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout"],"source":"code","verified":"2026-10-09","sha":"2f9de2a"},{"pr":"14400","where":[{"t":"core/git_local.go:GitCheckoutBase.provenTree","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_local.go#L94"},{"t":"core/git_local_history.go:LocalGitRef.mountHistory","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_local_history.go#L217"}],"what":"Commits on a remote parent produce owned shallow storage (HistorySource). A remote parent's canonical tree(discardGitDir: true) is pinned into CheckoutBase.Tree, so incremental trees never need another fetch; an unprovable tree is dropped and the full checkout runs. Source-only trees mount owned storage at depth 1; deep history hydrates on demand.","code":["GitRef.tree(discardGitDir, depth=1, includeTags)","  if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)","  if keep .git, depth 0, no tags: return GitRef.__fullCheckout","    (saved under its own recipe kind: gitFullCheckout)","  dir = DirectoryGitTreeLazy{ref, discard, depth, includeTags}   # built on first read, persisted","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes]), set after materialization","","GitCommit.tree(discardGitDir, depth=1, includeTags)","  if no .git: return repo.ref(SHA).tree(…)                   # shares GitRef.tree's pinned recipe","  else dir = DirectoryGitCommitTreeLazy{commit, …}            # never __fullCheckout","    on read: GitCommit.Tree: prefetch the commit; Backend.Tree(…)","  remote: same contentDigest, on the lazy","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (depth dropped once the mirror is complete: mirrorFetchDepth)","    (automatic maintenance runs synchronously, inside the lock)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only            # owned shallow: depth 1; deep reads hydrate first","  discard and CheckoutBase(parent; remote parents pin their tree) and SHA == CommitSHA (sole parent):","    incrementalTree: diff-tree parent SHA → COW child of parent's tree, write the delta only","  discard: new snapshot: init + alternates → mounted objects (no fetch); checkout; rm .git","  keep .git: new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout"],"source":"code","verified":"2026-10-09","sha":"a34d69b"},{"pr":"14472","where":[{"t":"core/git.go:persistedDirectoryLazyKindGitFullCheckout","u":"https://github.com/dagger/dagger/blob/9a2926b230aed0baf10e44c02603e0168e30cddf/core/git.go#L1765"}],"what":"The full checkout is saved under its own recipe kind (gitFullCheckout), so an engine that predates it rejects the recipe instead of rebuilding a tree without .git; part of saving recipes for every cached value that could otherwise not be rebuilt when a remote-cache part goes missing (5447b74).","code":["GitRef.tree(discardGitDir, depth=1, includeTags)","  if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)","  if keep .git, depth 0, no tags: return GitRef.__fullCheckout","    (saved under its own recipe kind: gitFullCheckout)","  dir = DirectoryGitTreeLazy{ref, discard, depth, includeTags}   # built on first read, persisted","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes]), set after materialization","","GitCommit.tree(discardGitDir, depth=1, includeTags)","  if no .git: return repo.ref(SHA).tree(…)                   # shares GitRef.tree's pinned recipe","  else dir = DirectoryGitCommitTreeLazy{commit, …}            # never __fullCheckout","    on read: GitCommit.Tree: prefetch the commit; Backend.Tree(…)","  remote: same contentDigest, on the lazy","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (depth dropped once the mirror is complete: mirrorFetchDepth)","    (automatic maintenance runs synchronously, inside the lock)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only","  discard and CheckoutBase(local parent) and SHA == CommitSHA (sole parent):","    incrementalTree: diff-tree parent SHA → COW child of parent's tree, write the delta only","  discard: new snapshot: init + alternates → mounted objects (no fetch); checkout; rm .git","  keep .git: new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout"],"source":"code","verified":"2026-10-09","sha":"9a2926b"},{"pr":"14576","where":[{"t":"core/schema/git.go:canonicalGitTreeArgs","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/schema/git.go#L2514"},{"t":"core/git_local.go:LocalGitRef.Tree","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_local.go#L518"},{"t":"core/git_local_checkout_tree.go:contentsCheckoutTree","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_local_checkout_tree.go#L44"},{"t":"core/git_local_cow.go:cowTree","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_local_cow.go#L48"},{"t":"core/git_source_tree.go:startGitSourceTree","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_source_tree.go#L24"}],"what":"Equivalent spellings of one tree become one call and one snapshot (treeCacheKey). Local source trees try three paths: incremental from any ancestor CheckoutBase (withCommit parent or pull receiver), a COW copy of the retained checkout the storage came from (inferred from the producing recipe, for traces recorded before checkout bases), then the full alternates checkout. Retained checkouts (keep .git, depth 0) become COW children: a delta on the base's own checkout (fetching only what is missing, negotiated from HEAD), else a wipe of the repository snapshot with one parallel checkout -f, else the old fetch. Every path records why the cheaper ones were skipped.","effect":"Cold resume of a heavy agent trace 10m23s → 4m53s (whole PR); e.g. 40 full source trees (165 s) and 26 full-history fetches (~3.4 s each) removed; a committed head's checkout layer 21 MiB → 0.5 MiB.","svg":"<svg viewBox='0 0 760 210' width='100%' font-family='sans-serif' font-size='11'><rect x='5' y='5' width='170' height='40' rx='8' fill='#1d2330'/><text x='90' y='29' text-anchor='middle' fill='#fff' font-weight='700'>LocalGitRef.Tree</text><text x='200' y='22' font-weight='700'>discardGitDir</text><rect x='200' y='30' width='170' height='34' rx='7' fill='#fff' stroke='#9aa3b5'/><text x='208' y='51'>① incremental (any ancestor)</text><rect x='385' y='30' width='175' height='34' rx='7' fill='#ffe3ee' stroke='#c2255c'/><text x='393' y='51'>② COW of retained checkout</text><rect x='575' y='30' width='175' height='34' rx='7' fill='#fde8e8' stroke='#d64545'/><text x='583' y='51'>③ full alternates checkout</text><path d='M370 47 H383 M560 47 H573' stroke='#d64545' stroke-width='2'/><text x='200' y='102' font-weight='700'>keep .git, depth ≤ 0</text><rect x='200' y='110' width='170' height='34' rx='7' fill='#ffe3ee' stroke='#c2255c'/><text x='208' y='131'>① COW delta on base checkout</text><rect x='385' y='110' width='175' height='34' rx='7' fill='#ffe3ee' stroke='#c2255c'/><text x='393' y='131'>② COW wipe: checkout -f</text><rect x='575' y='110' width='175' height='34' rx='7' fill='#fde8e8' stroke='#d64545'/><text x='583' y='131'>③ fetch whole history</text><path d='M370 127 H383 M560 127 H573' stroke='#d64545' stroke-width='2'/><text x='200' y='175' fill='#5b6475'>markers: git.tree.&lt;incremental|checkout|full&gt;[why] · git.checkout.&lt;delta|wipe|full&gt;[why]</text><text x='200' y='195' fill='#5b6475'>left to right: tried in order; any refusal or error falls through (nativeFallback)</text></svg>","code":["GitRef.tree(discardGitDir, depth=1, includeTags)","  args canonicalized: defaults dropped; no .git ⇒ depth, includeTags dropped (treeCacheKey)","  if no .git and ref named, not by SHA: return repo.ref(SHA).tree(…)","  if keep .git, depth 0, no tags: return GitRef.__fullCheckout","    (saved under its own recipe kind: gitFullCheckout)","  dir = DirectoryGitTreeLazy{ref, discard, depth, includeTags}   # built on first read, persisted","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name, remotes]), set after materialization","","GitCommit.tree(discardGitDir, depth=1, includeTags)","  if no .git: return repo.ref(SHA).tree(…)                   # shares GitRef.tree's pinned recipe","  else dir = DirectoryGitCommitTreeLazy{commit, …}            # never __fullCheckout","    on read: GitCommit.Tree: prefetch the commit; Backend.Tree(…)","  remote: same contentDigest, on the lazy","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA:refs/dagger.fetched/SHA (--depth=N | --unshallow)   # pinned negotiation tip","    (depth dropped once the mirror is complete: mirrorFetchDepth)","    (automatic maintenance runs synchronously, inside the lock)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only            # owned shallow: depth 1; deep reads hydrate first","  discard:","    ① incrementalTree: CheckoutBase (withCommit parent or pull receiver; any ancestor) → COW of its tree + delta","    ② contentsCheckoutTree: COW of the retained checkout the storage came from, minus .git (+ delta)","    ③ new snapshot: init + alternates → mounted objects (no fetch); checkout; rm .git","    marker: git.tree.<incremental|checkout|full>[why]","  keep .git, depth ≤ 0:","    ① COW delta: child of the base's __fullCheckout; fetch --negotiation-tip=HEAD; write the delta","    ② COW wipe: child of the repository snapshot; checkout -f every file (4 workers); no fetch","    ③ new snapshot: init; fetch <mount> SHA:tmpref; checkout","    marker: git.checkout.<delta|wipe|full>[why]","  keep .git, depth > 0: new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout"],"source":"code","verified":"2026-10-09","sha":"d8cf808"},{"pr":"base","where":[{"t":"core/schema/git.go:gitSchema.tree","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/git.go#L1437"},{"t":"core/git_remote.go:RemoteGitRef.Tree","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git_remote.go#L570"},{"t":"core/git_local.go:LocalGitRef.Tree","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git_local.go#L243"},{"t":"core/git.go:doGitCheckout","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git.go#L904"}],"what":"The resolver builds the tree eagerly. Remote refs hold the mirror lock while they fetch into the mirror AND check out, submodules included. Local refs fetch the history (to the requested depth) from the mounted repository into a fresh snapshot, even for trees without .git.","code":["GitRef.tree(discardGitDir, depth=1, includeTags)            # GitCommit.tree takes the same route","  dir = ref.Backend.Tree(discard, depth, includeTags)        # eager, in the resolver","  remote: contentDigest = hash(url, SHA, keepsGit [, depth, tags, name])","","RemoteGitRef.Tree(…)","  lock git-remote::<url>                                    # held for the whole block","    mirror: fetch origin SHA (--depth=N | --unshallow)","    new snapshot: init; fetch file://mirror SHA:tmpref (--depth=N)","      checkout; submodule update --init --recursive; [rm .git]; mtime = 1s","","LocalGitRef.Tree(…)","  mount repository snapshot read-only","  new snapshot: init; fetch <mount> SHA:tmpref (--depth=N); checkout; [rm .git]"],"source":"code","verified":"2026-10-09","sha":"5ddd194"}]},"uncommitted":{"title":"Repository pending changes (GitRepository.uncommitted / __cleaned)","short":"repo uncommitted","tabs":[{"pr":"14224","where":[{"t":"core/git_local.go:DirectoryGitCleanedLazy","u":"https://github.com/dagger/dagger/blob/9282dfa1271e1907a3e3af6dc2114df652ca2b62/core/git_local.go#L414"}],"what":"__cleaned becomes a lazy, persisted producer; when nothing needs cleaning it answers with the storage itself.","code":["GitRepository.uncommitted","  dirty = Backend.Dirty()                     # local: the storage directory","  clean = __cleaned → DirectoryGitCleanedLazy  # persisted producer; unchanged → storage itself","    COW child of storage; copy .git/index to a private file","    git restore --staged .","    git restore .","    git clean -fd","  return dirty.changes(from: clean)"],"source":"pr-description","sha":"9282dfa"},{"pr":"14576","where":[{"t":"core/git_local.go:cleanGitWorktree","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_local.go#L356"}],"what":"Retained checkouts and commits store an index without stat data, so restore found every entry changed and rewrote the whole worktree into the new layer. The private index is refreshed first (content compare, read-only), so restore rewrites only files that really differ.","effect":"Up to 6.6 s per call on dagger/dagger, 100+ calls per resume (every pulled repository's uncommitted).","code":["GitRepository.uncommitted","  dirty = Backend.Dirty()                     # local: the storage directory","  clean = __cleaned → DirectoryGitCleanedLazy  # persisted producer; unchanged → storage itself","    COW child of storage; copy .git/index to a private file","    git restore --staged .","    git update-index -q --unmerged --refresh  # errors ignored: only loses the shortcut","    git restore .","    git clean -fd","  return dirty.changes(from: clean)"],"source":"code","sha":"d8cf808"},{"pr":"base","where":[{"t":"core/schema/git.go:gitSchema.uncommitted","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/git.go#L1295"},{"t":"core/git_local.go:LocalGitRepository.Cleaned","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git_local.go#L82"}],"what":"Compares the storage directory (dirty) with a cleaned copy: a COW child where restore runs on a private copy of the index (so the index is not reported as changed). reset --hard is avoided because it rewrites every file.","code":["GitRepository.uncommitted","  dirty = Backend.Dirty()                     # local: the storage directory","  clean = __cleaned                           # persisted field","    COW child of storage; copy .git/index to a private file","    git restore --staged .","    git restore .","    git clean -fd","  return dirty.changes(from: clean)"],"source":"pr-description","sha":"5ddd194"}]},"withchanges":{"title":"Applying a changeset (Directory.withChanges · Workspace.withChanges)","short":"withChanges","tabs":[{"pr":"14466","where":[{"t":"core/directory.go:WithChanges","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/directory.go#L3389"}],"what":"Copies the declared added/modified paths straight out of After; the filtered copy only descends into the changed paths' parents, so it costs the size of the change and does not evaluate Before.","effect":"Part of ~150 ms → proportional-to-change for a one-file edit on a 5,000-file workspace (diff ~88 ms, of which ~63 ms evaluating Before).","code":["Directory.withChanges(changes)              # Workspace.withChanges records it in the overlay","  copy declared added/modified paths straight out of changes.After (only their parents descended)","  remove declared removals; recreate empty added directories"],"source":"pr-description","sha":"1850411"},{"pr":"base","where":[{"t":"core/directory.go:WithChanges","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/directory.go#L3026"}],"what":"Built a structural Before.diff(After) and copied the declared paths out of it; the diff walked both trees and forced Before to be evaluated.","code":["Directory.withChanges(changes)              # Workspace.withChanges records it in the overlay","  diff = changes.Before.diff(changes.After)  # structural diff: walks both trees","  copy declared added/modified paths out of diff","  remove declared removals"],"source":"pr-description","sha":"5ddd194"}]},"wscommit":{"title":"Workspace commit (Workspace.withCommit)","short":"ws withCommit","tabs":[{"pr":"14147","where":[{"t":"core/schema/workspace_commit.go:workspaceSchema.withCommit","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_commit.go#L60"}],"what":"Introduced: commit an explicit changeset to HEAD and merge the same delta into the frozen working tree, so compatible unselected edits and incoming content both survive; only the difference from the new HEAD stays pending. Missing author fields are read from the client's git config and recorded for replay.","code":["Workspace.withCommit(changes, message, date, author?)","  author missing → read client git config; re-select with explicit identity","  frozen = freeze(receiver)                            # snapshot if live","  uncommitted = frozen.git.uncommitted","  working = (HEAD.tree(discardGitDir) + uncommitted).changes(from: changes.Before)","  merged = working.withChangeset(changes, FAIL)          # general merge: git add -A of the whole base","  C1 = frozen.git.head.withCommit(changes, …)          # see GitRef.withCommit","  W1 = C1.asWorkspace","  remaining = merged.After.changes(from: W1 root)","  return W1.withChanges(remaining) + workspace metadata"],"source":"code","sha":"40a74d0"},{"pr":"14397","where":[{"t":"core/schema/workspace_commit.go:changesetMergeForWorkspaceCommit","u":"https://github.com/dagger/dagger/blob/4473191c10743976f2852b1432bf61b72d84ca33/core/schema/workspace_commit.go#L203"},{"t":"core/changeset_native.go:TryNativeWorkspaceMerge","u":"https://github.com/dagger/dagger/blob/4473191c10743976f2852b1432bf61b72d84ca33/core/changeset_native.go#L32"}],"what":"The working-tree merge goes through a private __mergeForWorkspaceCommit: a native merge stages each delta in a private sparse index over borrowed objects, runs git merge-tree, and replays only the changed-path checkout transitions on a COW child of Before. A native conflict is final. When both deltas sit on HEAD's tree, the approved delta is reused instead of being rebuilt and re-diffed.","effect":"Median Workspace.withCommit on a 12k-file repo: 11.07 s (before the stack) → 4.59 s (#14396) → 2.28 s.","svg":"<svg viewBox='0 0 760 110' width='100%' font-family='sans-serif' font-size='11'><rect x='5' y='35' width='190' height='40' rx='8' fill='#efe8ff' stroke='#7b4fd6'/><text x='15' y='59' font-weight='700'>__mergeForWorkspaceCommit</text><rect x='225' y='10' width='300' height='40' rx='8' fill='#e2f6ee' stroke='#1f9d6b'/><text x='235' y='27'>native: sparse stage ×2 · merge-tree · replay</text><text x='235' y='42' fill='#5b6475'>on a COW child of Before; conflict is final</text><rect x='225' y='62' width='300' height='40' rx='8' fill='#fde8e8' stroke='#d64545'/><text x='235' y='79'>general: __mergeWithChangeset(FAIL)</text><text x='235' y='94' fill='#5b6475'>git add -A of the whole base in a scratch repo</text><path d='M195 50 L223 30 M195 60 L223 82' stroke='#1d2330' stroke-width='1.5'/><text x='545' y='34' fill='#1f9d6b'>eligible (provenance, controls, paths)</text><text x='545' y='86' fill='#d64545'>any refusal or error</text></svg>","code":["Workspace.withCommit(changes, message, date, author?)","  author missing → read client git config; re-select with explicit identity","  frozen = freeze(receiver)                            # snapshot if live","  uncommitted = frozen.git.uncommitted","  uncommitted and changes both on HEAD's tree → working = uncommitted","  else working = (HEAD.tree(discardGitDir) + uncommitted).changes(from: changes.Before)","  merged = working.__mergeForWorkspaceCommit(changes)    # persisted private recipe","    native: stage each side sparsely; merge-tree --write-tree; replay checkouts on COW of Before","    else:   working.withChangeset(changes, FAIL)         # general merge: git add -A of the whole base","  C1 = frozen.git.head.withCommit(changes, …)          # see GitRef.withCommit","  W1 = C1.asWorkspace","  remaining = merged.changes(from: W1 root)","  return W1.withChanges(remaining) + workspace metadata"],"source":"code","sha":"4473191"},{"pr":"14466","where":[{"t":"core/changeset.go:ComputePaths","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/changeset.go#L166"},{"t":"core/changeset.go:MergeWithChangeset","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/changeset.go#L1443","n":"2094a4a"}],"what":"Every changeset this path reads (working, incoming, remaining) has its paths and diffs computed from the layers between its snapshots, and merges avoid whole-tree walks (2094a4a 'keep changeset merges proportional to change').","code":["Workspace.withCommit(changes, message, date, author?)","  author missing → read client git config; re-select with explicit identity","  frozen = freeze(receiver)                            # snapshot if live","  uncommitted = frozen.git.uncommitted","  uncommitted and changes both on HEAD's tree → working = uncommitted","  else working = (HEAD.tree(discardGitDir) + uncommitted).changes(from: changes.Before)","  merged = working.__mergeForWorkspaceCommit(changes) → DirectoryMergeChangesetsLazy   # saved recipe","    native: stage each side sparsely; merge-tree --write-tree; replay checkouts on COW of Before","    else:   working.withChangeset(changes, FAIL)         # general merge: git add -A of the whole base","    (paths and diffs from layer walks, not whole-tree walks)","  C1 = frozen.git.head.withCommit(changes, …)          # see GitRef.withCommit","  W1 = C1.asWorkspace","  remaining = merged.changes(from: W1 root)","  return W1.withChanges(remaining) + workspace metadata"],"source":"code","sha":"1850411"},{"pr":"14472","where":[{"t":"core/changeset.go:DirectoryMergeChangesetsLazy","u":"https://github.com/dagger/dagger/blob/9a2926b230aed0baf10e44c02603e0168e30cddf/core/changeset.go#L2425"}],"what":"Changeset merges (including the workspace reconciliation) get saved recipes (fd99afc); merge conflicts are reported where they are wrapped.","code":["Workspace.withCommit(changes, message, date, author?)","  author missing → read client git config; re-select with explicit identity","  frozen = freeze(receiver)                            # snapshot if live","  uncommitted = frozen.git.uncommitted","  uncommitted and changes both on HEAD's tree → working = uncommitted","  else working = (HEAD.tree(discardGitDir) + uncommitted).changes(from: changes.Before)","  merged = working.__mergeForWorkspaceCommit(changes) → DirectoryMergeChangesetsLazy   # saved recipe","    native: stage each side sparsely; merge-tree --write-tree; replay checkouts on COW of Before","    else:   working.withChangeset(changes, FAIL)         # general merge: git add -A of the whole base","  C1 = frozen.git.head.withCommit(changes, …)          # see GitRef.withCommit","  W1 = C1.asWorkspace","  remaining = merged.changes(from: W1 root)","  return W1.withChanges(remaining) + workspace metadata"],"source":"code","sha":"9a2926b"},{"pr":"14576","where":[{"t":"core/changeset.go:gitMergeChangesets","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset.go#L2159"},{"t":"core/changeset.go:initScopedGitRepo","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset.go#L2641"},{"t":"core/changeset_native.go:validateNativeWorkspaceDelta","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset_native.go#L160"},{"t":"core/changeset_merge_phases.go:mergePhases","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset_merge_phases.go#L19"}],"what":"Native merges now accept new and empty directories and directory metadata changes (umask-000 agent patches create 0777 dirs, which used to force the general merge). The general fallback builds a scoped base: objects only for declared paths, diff entries, replaced subtrees and control files; everything else hashed with update-index --info-only (full base on any failure). Every merge git command is a wcprof op under its phase; fallbacks are markers. Canonical tree args keep both sides in one lineage, so walks hit layers.","effect":"Native merges on a 16k-file workspace ~105 ms instead of 250–480 ms; scoped base on a 9k-file slice 0.6 s vs 1.45 s; __mergeWithChangeset p50 7.3 → 4.4 s (uncompressed throwaway objects).","code":["Workspace.withCommit(changes, message, date, author?)","  author missing → read client git config; re-select with explicit identity","  frozen = freeze(receiver)                            # snapshot if live","  uncommitted = frozen.git.uncommitted","  uncommitted and changes both on HEAD's tree → working = uncommitted","  else working = (HEAD.tree(discardGitDir) + uncommitted).changes(from: changes.Before)","  merged = working.__mergeForWorkspaceCommit(changes) → DirectoryMergeChangesetsLazy   # saved recipe","    native: stage each side sparsely; merge-tree --write-tree; replay checkouts on COW of Before","      (new/empty directories and directory metadata now native)","    else:   __mergeWithChangeset: scoped base (objects only in scope) → full git add -A base","    (paths and diffs from layer walks, not whole-tree walks)","    markers: git.native_merge.fallback[…] · git.merge.scoped_fallback[…] · git.<verb> per command","  C1 = frozen.git.head.withCommit(changes, …)          # see GitRef.withCommit","  W1 = C1.asWorkspace","  remaining = merged.changes(from: W1 root)","  return W1.withChanges(remaining) + workspace metadata"],"source":"code","sha":"d8cf808"}]},"wsgitdir":{"title":"Workspace retained checkout (WorkspaceGit.directory / __checkout)","short":"ws .git dir","tabs":[{"pr":"14147","where":[{"t":"core/schema/workspace_commit.go:workspaceGitDirectory","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_commit.go#L180"},{"t":"core/schema/workspace_commit.go:workspaceGitFullCheckout","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_commit.go#L192"},{"t":"core/schema/git.go:gitSchema.fullCheckout","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L2015"}],"what":"Introduced: a self-contained .git with full reachable history and an index matching HEAD. It shares one materialization with public retained trees: WorkspaceGit.__checkout selects head.__fullCheckout, which is keyed by the resolved ref and not by pending edits. Pulls, resets and exports all start from this checkout.","code":["WorkspaceGit.directory = git.__checkout.directory('.git')","WorkspaceGit.__checkout = git.head.__fullCheckout           # keyed by the resolved ref","GitRef.__fullCheckout = Backend.Tree(keep .git, depth 0)","  remote: lock; mirror fetch --unshallow; checkout (see GitRef.tree)","  local:  new snapshot: init; fetch the whole history from the mount; checkout","  finish: read-tree HEAD (index without stat data); mtime = 1s"],"source":"code","sha":"40a74d0"},{"pr":"14167","where":[{"t":"core/git_remote.go:RemoteGitRef.Tree","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git_remote.go#L866","n":"branch"}],"what":"Proposed: remote HEADs copy their full history out of the mirror with pack-objects and finish the checkout after releasing the lock.","effect":"1.16 s vs 3.29 s lock hold for a full-history copy of dagger/dagger.","code":["WorkspaceGit.directory = git.__checkout.directory('.git')","WorkspaceGit.__checkout = git.head.__fullCheckout           # keyed by the resolved ref","GitRef.__fullCheckout = Backend.Tree(keep .git, depth 0)   # recipe kind gitFullCheckout","  remote: lock only for mirror fetch + pack-objects copy-out; checkout after unlock","  local:  new snapshot: init; fetch the whole history from the mount; checkout","  finish: read-tree HEAD (index without stat data); mtime = 1s"],"source":"code","sha":"655c54e"},{"pr":"14472","where":[{"t":"core/git.go:persistedDirectoryLazyKindGitFullCheckout","u":"https://github.com/dagger/dagger/blob/9a2926b230aed0baf10e44c02603e0168e30cddf/core/git.go#L1765"}],"what":"Saved under its own recipe kind so it can be rebuilt (and older engines refuse rather than rebuild a tree without .git).","code":["WorkspaceGit.directory = git.__checkout.directory('.git')","WorkspaceGit.__checkout = git.head.__fullCheckout           # keyed by the resolved ref","GitRef.__fullCheckout = Backend.Tree(keep .git, depth 0)   # recipe kind gitFullCheckout","  remote: lock; mirror fetch --unshallow; checkout (see GitRef.tree)","  local:  new snapshot: init; fetch the whole history from the mount; checkout","  finish: read-tree HEAD (index without stat data); mtime = 1s"],"source":"code","sha":"9a2926b"},{"pr":"14576","where":[{"t":"core/git_local_cow.go:cowTree","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_local_cow.go#L48"},{"t":"core/git_local_cow.go:cowDeltaTree","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_local_cow.go#L139"},{"t":"core/git_local_cow.go:cowWipeTree","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_local_cow.go#L263"},{"t":"core/git_local_cow.go:cowGitCheckout","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_local_cow.go#L408"},{"t":"core/git.go:finishGitCheckout","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git.go#L1423","n":"gitCheckoutReuse"}],"what":"Local HEADs get copy-on-write checkouts: a delta on the base's own checkout (CheckoutBase, or inferred: checkout | checkout-git-dir | pull-receiver), else a wipe of the repository snapshot with one parallel checkout -f and no fetch (tags recorded with for-each-ref --merged). Inherited objects are never rewritten (timestamp walk skips .git/objects by inode); the snapshot root gets a fresh snapshot's mode and owner.","effect":"~3.4 s of transfer + index-pack per checkout × 26 on one resume removed; synthetic 5000-commit history 0.6–1.7 s → 0.13 s (wipe); committed head's layer 21 MiB → 0.5 MiB (delta).","code":["WorkspaceGit.directory = git.__checkout.directory('.git')","WorkspaceGit.__checkout = git.head.__fullCheckout           # keyed by the resolved ref","GitRef.__fullCheckout = Backend.Tree(keep .git, depth 0)   # recipe kind gitFullCheckout","  remote: lock; mirror fetch --unshallow; checkout (see GitRef.tree)","  local:  ① COW delta on base checkout ② COW wipe (checkout -f, no fetch) ③ fetch the whole history","  finish: read-tree HEAD (index without stat data); mtime = 1s (skips inherited .git/objects)"],"source":"code","sha":"d8cf808"}]},"wsrepo":{"title":"Workspace repository (Workspace.git · WorkspaceGit.head)","short":"ws repo/head","tabs":[{"pr":"14000","where":[{"t":"core/schema/workspace.go:materializeWorkspaceGitUncommitted","u":"https://github.com/dagger/dagger/blob/b37370b922dc616858c4600d5acbd010f4c67aa6/core/schema/workspace.go#L2706"},{"t":"core/git_hostdir.go:MaterializeHostGitCheckout","u":"https://github.com/dagger/dagger/blob/b37370b922dc616858c4600d5acbd010f4c67aa6/core/git_hostdir.go#L57"},{"t":"engine/session/git/git_pack.go:PackCheckout","u":"https://github.com/dagger/dagger/blob/b37370b922dc616858c4600d5acbd010f4c67aa6/engine/session/git/git_pack.go#L79"}],"what":"The client's own git packs its repository (PackCheckout, keyed by a CheckoutState digest) and the engine rebuilds a canonical .git, so worktrees, submodules, separate git dirs and partial clones all work. Host workspaces skip the full root sync: check out the canonical HEAD and apply only the client's git-visible uncommitted delta (PackUncommitted → __withGitUncommitted); old clients fall back to the full directory.","code":["Workspace.git → WorkspaceGit                         # errors unless .git exists","WorkspaceGit.head = __repository.head","WorkspaceGit.__repository:","  host-backed: canonical = Host.__gitDir (client PackCheckout, keyed by CheckoutState)","    clean = canonical.asGit.head.tree(discardGitDir: false, depth: 0, includeTags: true)","    dir = clean.__withGitUncommitted(client PackUncommitted delta)   # no full root sync","  fallback: dir = resolveRootfs('.'); MaterializeHostGitCheckout(dir)   # canonical .git","  return LocalGitRepository{dir}"],"source":"code","sha":"b37370b"},{"pr":"14147","where":[{"t":"core/schema/workspace.go:workspaceGitHead","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace.go#L3338"},{"t":"core/workspace.go:Workspace.SourceGitRef","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/workspace.go#L314"}],"what":"Frozen (value) workspaces are a pinned GitRef plus an overlay: head returns that ref and __repository its repository directly, with no host access.","code":["Workspace.git → WorkspaceGit                         # errors unless .git exists","WorkspaceGit.head = frozen ? its pinned GitRef : __repository.head","WorkspaceGit.__repository:","  frozen (git-ref source): ref.Repo","  host-backed: canonical = Host.__gitDir (client PackCheckout, keyed by CheckoutState)","    clean = canonical.asGit.head.tree(discardGitDir: false, depth: 0, includeTags: true)","    dir = clean.__withGitUncommitted(client PackUncommitted delta)   # no full root sync","  fallback: dir = resolveRootfs('.'); MaterializeHostGitCheckout(dir)   # canonical .git","  return LocalGitRepository{dir}"],"source":"code","sha":"40a74d0"},{"pr":"base","where":[{"t":"core/schema/workspace.go:workspaceGitRepository","u":"https://git hat were removed. Directories are indicated by a\ntrailing slash, and their child paths are not included."},{"field":"Changeset.isEmpty","sig":["isEmpty: Boolean!"],"doc":"Returns true if the changeset is empty (i.e. there are no changes)."},{"field":"Changeset.diffStats","sig":["diffStats: [DiffStat!]!"],"doc":"Structured per-path diff statistics (kind and line counts) for this changeset."}],"aliases":["Changeset.paths"]},{"id":"Changeset.asPatch","type":"Changeset","field":"asPatch","impl":"aspatch","since":"pre-cutoff","sigs":[{"field":"Changeset.asPatch","sig":["asPatch: File!"],"doc":"Return a Git-compatible patch of the changes"}]},{"id":"Changeset.export","type":"Changeset","field":"export","impl":"csexport","since":"pre-cutoff","sigs":[{"field":"Changeset.export","sig":["export(path: String!): String!"],"doc":"Applies the diff represented by this changeset to a path on the host."}]},{"id":"Changeset.withChangeset","type":"Changeset","field":"withChangeset","impl":"merge","since":"pre-cutoff","sigs":[{"field":"Changeset.withChangeset","sig":["withChangeset(","  changes: ID!  # Changeset","  onConflict: ChangesetMergeConflict = FAIL","): Changeset!"],"doc":"Add changes to an existing changeset\n\nBy default the operation will fail in case of conflicts, for instance a file\nmodified in both changesets. The behavior can be adjusted using onConflict\nargument"},{"field":"Changeset.withChangesets","sig":["withChangesets(","  changes: [ID!]!  # Changeset","  onConflict: ChangesetsMergeConflict = FAIL","): Changeset!"],"doc":"Add changes from multiple changesets using git octopus merge strategy\n\nThis is more efficient than chaining multiple withChangeset calls when merging many changesets.\n\nOnly FAIL and FAIL_EARLY conflict strategies are supported (octopus merge cannot use -X ours/theirs)."}]},{"id":"Workspace.compareCommitsFrom","type":"Workspace","field":"compareCommitsFrom","impl":"pull","since":"14147","sigs":[{"field":"Workspace.compareCommitsFrom","sig":["compareCommitsFrom(","  source: ID!  # Workspace","  commits: [String!] = []","  maxCommits: Int = 100","): [WorkspaceCommitPick!]!"],"doc":"Preview which source commits withCommitsFrom would apply, skip, or report as conflicting.\n\nResults are ordered oldest first and account for earlier applicable commits in\nthe same preview. The preview does not apply commits or write to the checkout.\n\nA local receiver is snapshotted automatically; untracked files require\ninteractive approval. Source uncommitted changes are ignored. Exceeding\nmaxCommits fails rather than returning a partial preview. Divergent merge\ncommits require manual integration."}]},{"id":"Workspace.export","type":"Workspace","field":"export","impl":"export","since":"pre-cutoff","sigs":[{"field":"Workspace.export","sig":["export(","  path: String = \"\"","  from: ID  # Workspace","): Void!"],"doc":"Write this workspace's commits and pending changes to a checkout on the calling client.\n\nPath selects the destination; omitting it uses the calling client's current\nlocal workspace root, including when exporting a snapshot or committed\nworkspace. Exported file paths are relative to the workspace root regardless\nof its working directory. This writes only to the client making the call,\nnever the source's client.\n\nA live workspace exported to its own checkout applies only its overlay edits,\nwithout capturing the whole checkout. This also applies with an explicit path.\nPass from with the same live base to apply only changes since that overlay\nstate.\n\nOther exports integrate divergent commits by cherry-picking, preserve\nunrelated checkout edits, and refuse conflicts. Live inputs are snapshotted\nautomatically; capturing untracked source files requires interactive approval.\nStable inputs retain their baseline. Pass from to save only work since an\nearlier source value, including previously saved pending edits that are now\ncommitted."}],"note":"Git integration since #14147."},{"id":"Workspace.git","type":"Workspace","field":"git","impl":"wsrepo","since":"pre-cutoff","sigs":[{"field":"Workspace.git","sig":["git: WorkspaceGit!"],"doc":"Git state for this workspace. Errors if the workspace is not in a git repository."}]},{"id":"Workspace.snapshot","type":"Workspace","field":"snapshot","impl":"snapshot","since":"14147","sigs":[{"field":"Workspace.snapshot","sig":["snapshot: Workspace!  @experimental"],"doc":"Return a snapshot of this workspace as a stable value.\n\nGit capture is a progressive enhancement: if the workspace has no Git\nrepository or commits, or the client cannot capture Git, return this workspace\nunchanged. Approval rejections and capture failures remain errors.\n\nUse the returned workspace for subsequent reads, edits, and module loading\nagainst the captured baseline. Snapshotting an existing stable value preserves\nits baseline; snapshot currentWorkspace again to capture later checkout\nchanges.\n\nOnly the owning client can capture a local checkout. Tracked changes are\ncaptured automatically; untracked files require interactive approval. Remote\nGit refs are pinned to their resolved commits. Capturing leaves the checkout\nunchanged.\n\nThe recipe is portable when a remote can serve its base; otherwise it is frozen for this session only."}]},{"id":"Workspace.withChanges","type":"Workspace","field":"withChanges","impl":"withchanges","since":"pre-cutoff","sigs":[{"field":"Workspace.withChanges","sig":["withChanges(","  changes: ID!  # Changeset","): Workspace!"],"doc":"Return this workspace with a changeset applied, without mutating the source."}],"note":"Recorded in the workspace overlay; materialized through Directory.withChanges."},{"id":"Workspace.withCommit","type":"Workspace","field":"withCommit","impl":"wscommit","since":"14147","sigs":[{"field":"Workspace.withCommit","sig":["withCommit(","  changes: ID!  # Changeset","  message: String!","  date: String!","  authorName: String","  authorEmail: String","  signoff: Boolean = false","): Workspace!"],"doc":"Create a Git commit from a changeset and return a stable workspace with HEAD advanced.\n\nThe changeset is three-way merged into both HEAD and the frozen working tree.\nCompatible unselected edits remain uncommitted; incoming changes need not\nalready be in the working tree. Conflicts with either tree fail without\nmodifying the workspace. Empty changesets, or changes already present in HEAD,\nfail with nothing to commit.\n\nA local workspace is snapshotted automatically before committing; untracked\nfiles require interactive approval. The host checkout is not modified.\n\nMissing author fields are resolved from Git config in the calling client's\nworking directory at commit time, then recorded explicitly for reproducible\ncommits. Unconfigured fields default to Dagger and dagger@localhost."}]},{"id":"Workspace.withCommitsFrom","type":"Workspace","field":"withCommitsFrom","impl":"pull","since":"14147","sigs":[{"field":"Workspace.withCommitsFrom","sig":["withCommitsFrom(","  source: ID!  # Workspace","  commits: [String!] = []","  maxCommits: Int = 100","): Workspace!"],"doc":"Integrate source commits into this workspace and return the result, preserving\nthis workspace's uncommitted changes and metadata.\n\nFast-forward when the selected commits include all new ancestors of their tip;\notherwise cherry-pick them oldest first. Already integrated commits and\npatches already present are skipped. Any conflict fails the operation. Source\nuncommitted changes are not transferred; merge them explicitly if needed. Use\ncompareCommitsFrom to preview the integration.\n\nA local receiver is snapshotted automatically; untracked files require\ninteractive approval. The checkout is not modified. Export the result with an\nexplicit path to write it to a checkout.\n\nCherry-picks preserve the source author and author date, use the calling\nclient's Git config for committer identity, and reuse the source committer\ndate for reproducible hashes. Origin trailers track cherry-picked commits.\nDivergent merge commits require manual integration."}]},{"id":"Workspace.withReset","type":"Workspace","field":"withReset","impl":"reset","since":"14147","sigs":[{"field":"Workspace.withReset","sig":["withReset(commit: String!, hard: Boolean = false): Workspace!"],"doc":"Move this workspace's Git HEAD to a commit and return the resulting stable workspace.\n\nA local workspace is snapshotted automatically before resetting; untracked\nfiles require interactive approval. The host checkout is not modified. By\ndefault the difference between the previous working tree and the target commit\nstays uncommitted, as with git reset --mixed, so history can be reworked and\nreapplied with withCommit — e.g. to amend the latest commit message, reset\nto its parent and commit again.\n\nWith hard, the working tree is reset to the commit and every uncommitted change is discarded.\n\nCommits orphaned by the reset are not preserved: the frozen repository keeps\nreachable history only, so a reset cannot be undone by resetting forward\nagain."}]},{"id":"WorkspaceGit.directory","type":"WorkspaceGit","field":"directory","impl":"wsgitdir","since":"14147","sigs":[{"field":"WorkspaceGit.directory","sig":["directory: Directory!"],"doc":"Return a self-contained Git metadata directory for this workspace's HEAD,\nincluding its full reachable history and an index matching HEAD.\n\nMount this directory at .git alongside workspace.directory(\"/\") to create a\nusable checkout. Pending workspace edits remain uncommitted; the original\ncheckout's staging state is not preserved.\n\nThis is a snapshot: Git writes to a mounted copy do not update the workspace.\nThe workspace must have a Git repository with a HEAD commit."}]},{"id":"WorkspaceGit.head","type":"WorkspaceGit","field":"head","impl":"wsrepo","since":"pre-cutoff","sigs":[{"field":"WorkspaceGit.head","sig":["head: GitRef!"],"doc":"The checked-out HEAD of this workspace."}]},{"id":"WorkspaceGit.uncommitted","type":"Wor e first has nothing to build on, but the second could be a near-free delta of the first (same HEAD). Also, includeTags keeps the first one from routing to __fullCheckout or being canonicalized, although LocalGitRef.Tree's COW path ignores includeTags (it records reachable tags itself).","proposal":"Select __fullCheckout for the canonical HEAD (or drop includeTags for local depth-0 trees in canonicalGitTreeArgs, after checking tag parity), and teach gitContentsCheckoutBase that __withGitUncommitted over a checkout is a 'pull-receiver'-like case whose base is that checkout.","size":"S–M","risk":"low","status":"open","discovered_in":"14576","prs":["14576"],"apis":["Workspace.git","WorkspaceGit.directory"],"pointers":[{"t":"core/schema/workspace.go:materializeWorkspaceGitUncommitted @4e9d0b0","u":"https://github.com/dagger/dagger/blob/4e9d0b04e218427fdf2ff49f369f0530baf06279/core/schema/workspace.go#L3604"},{"t":"core/git_local_checkout_tree.go:gitContentsCheckoutBase @4e9d0b0","u":"https://github.com/dagger/dagger/blob/4e9d0b04e218427fdf2ff49f369f0530baf06279/core/git_local_checkout_tree.go#L160"},{"t":"core/schema/git.go:gitSchema.tree @4e9d0b0","u":"https://github.com/dagger/dagger/blob/4e9d0b04e218427fdf2ff49f369f0530baf06279/core/schema/git.go#L2532"},{"t":"core/schema/git.go:canonicalGitTreeArgs @4e9d0b0","u":"https://github.com/dagger/dagger/blob/4e9d0b04e218427fdf2ff49f369f0530baf06279/core/schema/git.go#L2514"},{"t":"core/git_local.go:LocalGitRef.Tree @4e9d0b0","u":"https://github.com/dagger/dagger/blob/4e9d0b04e218427fdf2ff49f369f0530baf06279/core/git_local.go#L518"}]},{"id":"f07-gitcommit-changes-walks-two-trees","kind":"lag","title":"GitCommit.changes walks two trees although git already knows the delta","body":"changes() diffs this.tree(discard) against the parent's tree. When the child tree is an incremental COW child the walk is a layer walk; for remote history or any non-incremental pair, it is a double walk of two whole checkouts (and both must be mater         return '<a class="chip" href="#' + esc(s.id) + '">' + esc(s.id) + '</a>';

    h += '<div class="tabs">' + ts.map(function (tb, i) {
      var pp = PR[tb.pr];
      var cls = 'tab' + (pp.state === 'base' ? ' base' : '') + (merged(pp) ? '' : ' u') + (isSel(pp.id) ? ' hl' : '') + (i === si ? ' sel' : '');

        '<span>' + esc(prLabel(pp)) + '</span><small>' + esc(stateText(pp)) + '</small></a>';

    h += '<div class="tabbody' + (merged(p) ? '' : ' u') + (isSel(p.id) ? ' hl' : '') + '"' + pcStyle(p) + '>';
