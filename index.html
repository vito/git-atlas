ent: storage = ref(SHA).__nativeCommitBase(depth 1)   # pack-objects closure, mirror lock","        (depth 0: approved host donor PackCommit first, else the remote)","      native: COW child of repo storage; scratch bare repo, objects via alternate","        read-tree; stage only changed paths (sparse); write-tree; commit-tree","        copy new objects only; publish branch / detached HEAD","    else, or any failure:","    tree = ref.tree(discardGitDir: true)","    applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree","    base = ref.asWorkspace.git.__checkout                  # full checkout with .git","    COW child of base: applyContent; stage; git commit (hooks off)","  repo = __withCommitRepository: withContents(dir) + CheckoutBase{Parent, CommitSHA, Tree} + HistorySource + Upstream","  return repo.head"],"source":"code","sha":"e2af618"},{"pr":"14472","where":[{"t":"core/git_commit_create.go:DirectoryGitCommitLazy","u":"https://github.com/dagger/dagger/blob/9a2926b230aed0baf10e44c02603e0168e30cddf/core/git_commit_create.go#L1046"}],"what":"__withCommitDirectory becomes a lazy operation with a saved recipe (8cfe040), so a cached commit can be recomputed when its remote-cache part is missing; the work still runs at the call.","code":["GitRef.withCommit(changes, message, date, author…)","  dir = __withCommitDirectory(args) → DirectoryGitCommitLazy   # saved recipe","    same-base provenance (Before = tree(discardGitDir) of this SHA, same repo recipe)?","      native: COW child of repo storage; scratch bare repo, objects via alternate","        read-tree; stage only changed paths (sparse); write-tree; commit-tree","        copy new objects only; publish branch / detached HEAD","    else, or any failure:","    tree = ref.tree(discardGitDir: true)","    applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree","    base = ref.asWorkspace.git.__checkout                  # full checkout with .git","    COW child of base: applyContent; stage; git commit (hooks off)","  repo = __withCommitRepository: withContents(dir) + CheckoutBase{Parent, CommitSHA}","  return repo.head"],"source":"code","sha":"9a2926b"},{"pr":"14576","where":[{"t":"core/git_commit_create.go:gitCommitChangesetNativeBaseReason","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_commit_create.go#L151"},{"t":"core/git_commit_create.go:nativeFallback","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_commit_create.go#L220"}],"what":"A provenance mismatch used to skip the native path silently; it is now recorded like any other fallback (before-not-git-tree, before-commit-mismatch, …) on the span and as a wcprof git.native.fallback[reason] marker. The checkout fallback's __checkout is now usually a COW checkout (see WorkspaceGit.directory).","code":["GitRef.withCommit(changes, message, date, author…)","  dir = __withCommitDirectory(args) → DirectoryGitCommitLazy   # saved recipe","    same-base provenance (Before = tree(discardGitDir) of this SHA, same repo recipe)?","      remote parent: storage = ref(SHA).__nativeCommitBase(depth 1)   # pack-objects closure, mirror lock","        (depth 0: approved host donor PackCommit first, else the remote)","      native: COW child of repo storage; scratch bare repo, objects via alternate","        read-tree; stage only changed paths (sparse); write-tree; commit-tree","        copy new objects only; publish branch / detached HEAD","    else, or any failure (reason recorded: git.native.fallback[…]):","    tree = ref.tree(discardGitDir: true)","    applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree","    base = ref.asWorkspace.git.__checkout                  # local HEAD: COW delta / wipe","    COW child of base: applyContent; stage; git commit (hooks off)","  repo = __withCommitRepository: withContents(dir) + CheckoutBase{Parent, CommitSHA, Tree} + HistorySource + Upstream","  return repo.head"],"source":"code","sha":"d8cf808"}]},"commitchanges":{"title":"Commit changes (GitCommit.changes)","short":"commit.changes","tabs":[{"pr":"14147","where":[{"t":"core/schema/git.go:gitSchema.commitChanges","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L2224"}],"what":"Introduced (b8626ba): the changeset from the first parent (or an arbitrary 'against' commit, even from another repository) to this commit, built from the two source-only trees.","code":["GitCommit.changes(against)","  before = against ?? first parent ?? empty directory","  after = this.tree(discardGitDir: true); before = before.tree(discardGitDir: true)","  return after.changes(from: before)","  paths: double walk of both trees"],"source":"pr-description","sha":"40a74d0"},{"pr":"14466","where":[{"t":"core/changeset.go:ComputePaths","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/changeset.go#L166"},{"t":"core/changeset_delta.go:collectChangesetDelta","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/changeset_delta.go#L176"}],"what":"When the commit's tree is a COW descendant of its parent's tree (an incremental checkout), paths come from walking only the layers in between. Two independent checkouts (e.g. remote history) still walk both whole trees.","code":["GitCommit.changes(against)","  before = against ?? first parent ?? empty directory","  after = this.tree(discardGitDir: true); before = before.tree(discardGitDir: true)","  return after.changes(from: before)","  paths: layers between the trees if one descends from the other; else double walk"],"source":"pr-description","sha":"1850411"}]},"commitmeta":{"title":"Commit metadata (GitCommit.sha, message, author…, releaseTag)","short":"commit meta","tabs":[{"pr":"base","where":[{"t":"core/git.go:GitCommit.Metadata","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git.go#L707"},{"t":"core/git.go:PrefillMetadata","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git.go#L745"},{"t":"core/schema/git.go:gitSchema.log","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/git.go#L2012"},{"t":"core/schema/git.go:selectGitReleaseTag","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/git.go#L1728"}],"what":"Metadata is read with git cat-file from a depth-1 mount of the commit (remote: a mirror read under its lock) and persisted per field; commits listed by log are the same cached objects as repo.commit(sha), with metadata pre-filled from the log output. Release tags are per session: remote tags come from the session's ls-remote, local tags from the storage. No implementation change since the cutoff.","code":["GitCommit.sha / message / authorName … / parentShas      # each persisted","  Metadata(): commit.Mount(depth 1) → git cat-file commit SHA → parse   # remote: under the mirror lock","  from log(): repo.commit(sha) + PrefillMetadata(log entry)   # no second cat-file","GitCommit.releaseTag / ancestorReleaseTag (per session)","  tags = session ls-remote (remote) + local tag refs; select semver; ancestor: depth-0 mount"],"source":"pr-description","sha":"5ddd194"}]},"contents":{"title":"Opening storage (withContents · asRepository · Directory.asGit)","short":"withContents","tabs":[{"pr":"14147","where":[{"t":"core/schema/git.go:withContents","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L1922"},{"t":"core/schema/git.go:gitRefAsRepository","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L1904"}],"what":"Introduced withContents (first named withDirectory, renamed in cbdc392): replace a repository's storage with a self-contained one (checkout, .git, or bare) while keeping the receiver's URL, remotes and push routing; never infers provenance. asRepository pins HEAD to a ref while keeping its backend.","code":["Directory.asGit = GitRepository{LocalGitRepository{this}}     # no URL, no routing","GitRepository.withContents(directory)               # persisted","  backend = LocalGitRepository{directory}; ValidateSelfContained","  keep receiver's URL, remotes, upstream selection, discard flag","GitRef.asRepository: clone repo; HEAD pinned to this ref"],"source":"pr-description","sha":"40a74d0"},{"pr":"14433","where":[{"t":"core/schema/git.go:withContents","u":"https://github.com/dagger/dagger/blob/e2af618b27b822685853b514ca92bc062252bfe1/core/schema/git.go#L2267"},{"t":"core/git_local.go:GitUpstream","u":"https://github.com/dagger/dagger/blob/e2af618b27b822685853b514ca92bc062252bfe1/core/git_local.go#L43"}],"what":"withContents retains the receiver's remote (or the remote the receiver was itself derived from) as Upstream, so names the supplied storage lacks resolve through it with the receiver's authentication.","code":["Directory.asGit = GitRepository{LocalGitRepository{this}}     # no URL, no routing","GitRepository.withContents(directory)               # persisted","  backend = LocalGitRepository{directory, Upstream: GitUpstream(receiver)}; ValidateSelfContained","  keep receiver's URL, remotes, upstream selection, discard flag","GitRef.asRepository: clone repo; HEAD pinned to this ref"],"source":"pr-description","sha":"e2af618"},{"pr":"base","where":[{"t":"core/schema/directory.go:asGit","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/directory.go#L1806"}],"what":"Directory.asGit opens any directory as a LocalGitRepository with no URL or routing.","code":["Directory.asGit = GitRepository{LocalGitRepository{this}}     # no URL, no routing"],"source":"pr-description","sha":"5ddd194"}]},"csexport":{"title":"Changeset export (Changeset.export)","short":"cs export","tabs":[{"pr":"14227","where":[{"t":"core/changeset.go:Changeset.Export","u":"https://github.com/dagger/dagger/blob/4056f4a8b225a01edc9de46ec54e03184b9780d8/core/changeset.go#L926"}],"what":"Writes only the declared added and modified paths and applies the declared removals, so an incremental export leaves untouched host files alone.","code":["Changeset.export(path)","  write only declared added/modified paths from After","  apply declared removals"],"source":"pr-description","sha":"4056f4a"},{"pr":"base","where":[{"t":"core/changeset.go:Changeset.Export","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/changeset.go#L817"}],"what":"Writes the changeset to a host path; per #14227's description, any path whose stat differed (e.g. timestamps) could be written, overwriting independent host content.","code":["Changeset.export(path)","  write changed content from After to the host path (stat-level differences included)","  apply removals"],"source":"pr-description","sha":"5ddd194"}]},"diff":{"title":"Snapshot diff (Directory.diff)","short":"Directory.diff","tabs":[{"pr":"14466","where":[{"t":"engine/snapshots/diffapply_linux.go:differ.HandleChanges","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/engine/snapshots/diffapply_linux.go#L570"},{"t":"engine/snapshots/fsdiff:WalkLayerDeltaChanges","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/engine/snapshots/fsdiff/overlay_layers_linux.go#L111"}],"what":"The layers separating two snapshots of one lineage (several layers apart, siblings on one ancestor, identical layers) list every difference and are walked instead. Each diff records its walk on its own span and as a wcprof op.","code":["Directory.diff(other)","  ApplySnapshotDiff(lower: other, upper: this)","  upper is exactly one layer above lower → walk that upperdir","  same lineage → walk only the separating layers (resolved in merged views)","  else double-walk both trees (read files whose metadata matches)","  span 'snapshot diff' · wcprof snapshot.diff[layer|layers|trees]"],"source":"pr-description","sha":"1850411"},{"pr":"base","where":[{"t":"engine/snapshots/diffapply_linux.go:differ.HandleChanges","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/engine/snapshots/diffapply_linux.go#L550"}],"what":"Walks a single overlay upperdir only when the upper snapshot is exactly one layer above the lower; every other case double-walks both trees and reads the content of every file whose metadata matches.","code":["Directory.diff(other)","  ApplySnapshotDiff(lower: other, upper: this)","  upper is exactly one layer above lower → walk that upperdir","  else double-walk both trees (read files whose metadata matches)"],"source":"pr-description","sha":"5ddd194"}]},"export":{"title":"Exporting to a checkout (Workspace.export)","short":"export","tabs":[{"pr":"14147","where":[{"t":"core/schema/workspace_export.go:workspaceSchema.saveWorkspace","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_export.go#L27"},{"t":"core/schema/workspace_export.go:applyWorkspaceBundle","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_export.go#L284"},{"t":"core/workspace_export.go:WorkspaceSaveDirectory","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/workspace_export.go#L179"}],"what":"Introduced: write a frozen source's commits and pending edits to a host checkout, preserving unrelated edits and staging, with retry safety: capture the destination, integrate in a COW copy of its retained checkout, and ship one bundle that the client applies guarded by the captured checkout-state digest.","code":["Workspace.export(path, from)","  freeze source (and from)","  metadata, bundle = CaptureGit(path)                  # destination, untracked dropped","  destination = rebuild from capture (git(url).withBundle(…).ref(HEAD).asWorkspace)","  dir = source.__saveDirectory(destination, from, committer)   # NotReplayable","    COW of destination git.__checkout","    fetch source HEAD; snapshot both sides' dirt; cherry-pick integrate; 2-parent transport commit","  bundle = dir.asGit.bundle(refs: [HEAD], base: destination HEAD)","  client ApplyBundle(bundle, expected checkout-state digest)"],"source":"pr-description","sha":"40a74d0"},{"pr":"14273","where":[{"t":"core/schema/workspace_export.go:workspaceSchema.export","u":"https://github.com/dagger/dagger/blob/0ceaef62fbf51d4df8137ad53649af30c205ab4e/core/schema/workspace_export.go#L28"},{"t":"core/schema/workspace_export.go:workspaceExportCapturedBase","u":"https://github.com/dagger/dagger/blob/0ceaef62fbf51d4df8137ad53649af30c205ab4e/core/schema/workspace_export.go#L232"}],"what":"Live workspaces exported onto their own checkout write only their overlay (sparse, no capture, no approval). Omitted path means the caller's local workspace root. Different baselines use conflict-checked Git integration, capturing live sources automatically; the source's own owned base is reused when it already is the destination's HEAD.","code":["Workspace.export(path, from)","  path empty → caller's local workspace root","  live overlay onto its own checkout → exportOverlay (sparse writes; no capture)","  freeze source (and from)","  metadata, bundle = CaptureGit(path)                  # destination, untracked dropped","  destination = reuse source's owned base if it is the captured HEAD (__workspaceExportBaseReady)","    else rebuild from capture (git(url).withBundle(…).ref(HEAD).asWorkspace)","  dir = source.__saveDirectory(destination, from, committer)   # NotReplayable","    COW of destination git.__checkout","    fetch source HEAD; snapshot both sides' dirt; cherry-pick integrate; 2-parent transport commit","  bundle = dir.asGit.bundle(refs: [HEAD], base: destination HEAD)","  client ApplyBundle(bundle, expected checkout-state digest)"],"source":"pr-description","sha":"0ceaef6"},{"pr":"14530","where":[{"t":"core/schema/workspace_export.go:composeWorkspaceExportDestination","u":"https://github.com/dagger/dagger/blob/0c586690122ce49d88c719f7f1f9e8123389f7fa/core/schema/workspace_export.go#L209"}],"what":"When the destination must be rebuilt from an SSH origin and no agent runs, the owner's SSH identities are prepared first (as snapshots already did), so ctrl+s in a private SSH repo no longer fails.","code":["Workspace.export(path, from)","  path empty → caller's local workspace root","  live overlay onto its own checkout → exportOverlay (sparse writes; no capture)","  freeze source (and from)","  metadata, bundle = CaptureGit(path)                  # destination, untracked dropped","  destination = reuse source's owned base if it is the captured HEAD (__workspaceExportBaseReady)","    else rebuild from capture (git(url).withBundle(…).ref(HEAD).asWorkspace)","      SSH origin, no agent → PrepareGitSSHAuth for the owner","  dir = source.__saveDirectory(destination, from, committer)   # NotReplayable","    COW of destination git.__checkout","    fetch source HEAD; snapshot both sides' dirt; cherry-pick integrate; 2-parent transport commit","  bundle = dir.asGit.bundle(refs: [HEAD], base: destination HEAD)","  client ApplyBundle(bundle, expected checkout-state digest)"],"source":"pr-description","sha":"0c58669"},{"pr":"14576","where":[{"t":"core/workspace_export.go:WorkspaceSaveDirectory","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/workspace_export.go#L180"}],"what":"Same two fixes as pulls: refresh the retained index before resets and add -A, and fetch the source HEAD with --negotiation-tip=HEAD instead of re-receiving the whole history.","code":["Workspace.export(path, from)","  path empty → caller's local workspace root","  live overlay onto its own checkout → exportOverlay (sparse writes; no capture)","  freeze source (and from)","  metadata, bundle = CaptureGit(path)                  # destination, untracked dropped","  destination = reuse source's owned base if it is the captured HEAD (__workspaceExportBaseReady)","    else rebuild from capture (git(url).withBundle(…).ref(HEAD).asWorkspace)","      SSH origin, no agent → PrepareGitSSHAuth for the owner","  dir = source.__saveDirectory(destination, from, committer)   # NotReplayable","    COW of destination git.__checkout","    update-index --refresh                             # attr dagger.git.export.index_refreshed","    fetch source HEAD --negotiation-tip=HEAD; snapshot both sides' dirt; cherry-pick integrate; 2-parent transport commit","  bundle = dir.asGit.bundle(refs: [HEAD], base: destination HEAD)","  client ApplyBundle(bundle, expected checkout-state digest)"],"source":"code","sha":"d8cf808"}]},"git":{"title":"Opening a remote repository","short":"Query.git","tabs":[{"pr":"14015","where":[{"t":"core/schema/git.go:cachedIsRemotePublic","u":"https://github.com/dagger/dagger/blob/7ff4e8d2aecbb75b33bb16e0ab6afd15a003ed8c/core/schema/git.go#L1036"}],"what":"A remote reached from both the CLI and module dependency resolution was probed once per client, because Query.git is per-client. The visibility probe is now cached per session (it sends no credentials, so the URL identifies the answer), except behind a service binding.","effect":"Part of removing the per-invocation cost of a remote git-ref module source (the PR's write-up: hack/designs/git-ref-module-source-cost.md).","code":["Query.git(url, keepGitDir, sshKnownHosts, sshAuthSocket, httpAuth…)   # cache: per client","  ambiguous scheme → try each clone URL candidate","  ssh, no socket: scope client's SSH_AUTH_SOCK (Host._sshAuthSocket) → re-select git(…, sshAuthSocket)","  https, no token:","    cachedIsRemotePublic(url)                 # one anonymous probe per session","    private → GetCredential (client helper) → setSecret → re-select git(…, httpAuthToken)","  mirror = Query._remoteGitMirror(url)       # one bare repo per URL","  return GitRepository{RemoteGitRepository{url, auth, services, mirror}}"],"source":"code","sha":"7ff4e8d"},{"pr":"14147","where":[{"t":"core/schema/git.go:gitSchema.git","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L489"},{"t":"core/schema/git.go:gitSchema.gitRepository","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L1084"}],"what":"Once every implicit input is explicit, Query.git delegates to a new client-independent __gitRepository, so all clients with the same inputs share one repository result and one downstream cache lineage (commit 57addd3). __gitRepository honors a deliberate per-client cache bust (workspace lock refresh) via CacheScopeInput (4e8f4d1).","code":["Query.git(url, keepGitDir, sshKnownHosts, sshAuthSocket, httpAuth…)   # cache: per client","  ambiguous scheme → try each clone URL candidate","  ssh, no socket: scope client's SSH_AUTH_SOCK (Host._sshAuthSocket) → re-select git(…, sshAuthSocket)","  https, no token:","    cachedIsRemotePublic(url)                 # one anonymous probe per session","    private → GetCredential (client helper) → setSecret → re-select git(…, httpAuthToken)","  return select __gitRepository(explicit args)   # client-independent, shared","__gitRepository(…)                            # cache: CacheScopeInput only","  mirror = Query._remoteGitMirror(url)       # one bare repo per URL","  return GitRepository{RemoteGitRepository{url, auth, services, mirror}}"],"source":"code","sha":"40a74d0"},{"pr":"14382","where":[{"t":"core/schema/git.go:cachedPublicRemote","u":"https://github.com/dagger/dagger/blob/7980ab3c7c6a9b6dad27884cf52309ac24526e34/core/schema/git.go#L1296"},{"t":"core/git_remote.go:RemoteGitRepository.PrimePublicRemote","u":"https://github.com/dagger/dagger/blob/7980ab3c7c6a9b6dad27884cf52309ac24526e34/core/git_remote.go#L120"}],"what":"The anonymous probe already receives the ref advertisement; the selected remote then ran git ls-remote for the same refs. The probe now returns the advertisement (HEAD, branches, tags, peeled tags, symrefs, in native order), which primes the session's ls-remote cache. Only anonymous HTTP(S) remotes seed it.","effect":"Skips the second ls-remote for public remotes.","code":["Query.git(url, keepGitDir, sshKnownHosts, sshAuthSocket, httpAuth…)   # cache: per client","  ambiguous scheme → try each clone URL candidate","  ssh, no socket: scope client's SSH_AUTH_SOCK (Host._sshAuthSocket) → re-select git(…, sshAuthSocket)","  https, no token:","    advertisement = cachedPublicRemote(url)    # one probe per session; nil = private","    private → GetCredential (client helper) → setSecret → re-select git(…, httpAuthToken)","  return select __gitRepository(explicit args)   # client-independent, shared","  public → backend.PrimePublicRemote(advertisement)   # seeds the session ls-remote cache","__gitRepository(…)                            # cache: CacheScopeInput only","  mirror = Query._remoteGitMirror(url)       # one bare repo per URL","  return GitRepository{RemoteGitRepository{url, auth, services, mirror}}"],"source":"code","sha":"7980ab3"},{"pr":"14488","where":[{"t":"core/schema/git.go:gitSchema.git","u":"https://github.com/dagger/dagger/blob/16155cdcae4b2169d24bd3a8330cac8915a5c2a0/core/schema/git.go#L528"},{"t":"core/schema/git.go:agentAddressScopedInput","u":"https://github.com/dagger/dagger/blob/16155cdcae4b2169d24bd3a8330cac8915a5c2a0/core/schema/git.go#L1100"}],"what":"URLs a model passes to a tool are lifted into Git objects in the context of whoever drives the conversation; a worker agent spawned by a module could not use the owner's credentials. Agent-supplied addresses may now use the owner's credentials after owner approval (AuthorizeGitRead), in a cache namespace of their own so they never mix with the caller's own lookups.","code":["Query.git(url, keepGitDir, sshKnownHosts, sshAuthSocket, httpAuth…)   # cache: per client; agent addresses namespaced","  ambiguous scheme → try each clone URL candidate","  ssh, no socket: scope client's SSH_AUTH_SOCK (Host._sshAuthSocket) → re-select git(…, sshAuthSocket)","  https, no token:","    advertisement = cachedPublicRemote(url)    # one probe per session; nil = private","    agent-supplied address → AuthorizeGitRead(owner) → use the owner's credential helper","    private → GetCredential (client helper) → setSecret → re-select git(…, httpAuthToken)","  return select __gitRepository(explicit args)   # client-independent, shared","  public → backend.PrimePublicRemote(advertisement)   # seeds the session ls-remote cache","__gitRepository(…)                            # cache: CacheScopeInput only","  mirror = Query._remoteGitMirror(url)       # one bare repo per URL","  return GitRepository{RemoteGitRepository{url, auth, services, mirror}}"],"source":"code","sha":"16155cd"},{"pr":"base","where":[{"t":"core/schema/git.go:gitSchema.git","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/git.go#L330"}],"what":"Query.git turns implicit credentials into explicit arguments and re-selects itself: an HTTPS remote that is not public gets a token from the client's credential helper (stored with setSecret), an SSH remote gets the client's agent socket scoped by key fingerprints. Visibility is probed with an anonymous go-git ls-remote on every call. The result is cached per client.","code":["Query.git(url, keepGitDir, sshKnownHosts, sshAuthSocket, httpAuth…)   # cache: per client","  ambiguous scheme → try each clone URL candidate","  ssh, no socket: scope client's SSH_AUTH_SOCK (Host._sshAuthSocket) → re-select git(…, sshAuthSocket)","  https, no token:","    IsRemotePublic(url)                       # anonymous probe, every call","    private → GetCredential (client helper) → setSecret → re-select git(…, httpAuthToken)","  mirror = Query._remoteGitMirror(url)       # one bare repo per URL","  return GitRepository{RemoteGitRepository{url, auth, services, mirror}}"],"source":"code","sha":"5ddd194"}]},"history":{"title":"History reads (log · contains · commonAncestor)","short":"history","tabs":[{"pr":"14167","where":[{"t":"core/git.go:refJoin","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git.go#L1994","n":"branch"},{"t":"core/git.go:joinGitObjects","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git.go#L2056","n":"new, branch"},{"t":"core/git_pack_copy.go:packGitClosure","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git_pack_copy.go#L180","n":"branch"}],"what":"Proposed: refJoin copies each ref's closure with pack-objects via a transient alternate (fallback: fetch), one ref at a time under its mutex; each pack excludes the history of the refs already joined, so a fork and its upstream share one copy of their common history. The branch is based on main, so it replaces the plain fetch, not #14576's negotiated one: whichever lands second has to merge the two.","code":["GitRef.log(limit, paths, base)","  unfiltered: fetch limit generations; uneven shallow boundary → retry with full history","  owned shallow storage: answer above the boundary; deeper → __hydrateRepository","  paths/base: ref.mount(depth 0) → git log …    # remote: --unshallow the mirror, under its lock","GitRef.commonAncestor(other) / contains(other)","  mountRefs(a, b):","    same repository → mount once","    local refs → alternates view over the mounted object stores (no fetch)","    owned shallow child vs its anchor/descendants → the child's store","    complete local donor holding every commit → alternates view (no fetch, no lock)","    owned child vs its exact remote parent → the child's objects","    else refJoin: tmp repo; per ref, pack-objects its closure ^ refs already joined via alternate (fallback: fetch)","  git merge-base [--is-ancestor]","  contains, history incomplete → containsWithFullHistory: fetch --unshallow only what is needed"],"source":"code","sha":"655c54e"},{"pr":"14395","where":[{"t":"core/git.go:mountCachedGitRefs","u":"https://github.com/dagger/dagger/blob/a96196e9d8ba4a8ebc77bc31d7bbac188469e84b/core/git.go#L1558"},{"t":"core/git.go:withGitObjectView","u":"https://github.com/dagger/dagger/blob/a96196e9d8ba4a8ebc77bc31d7bbac188469e84b/core/git.go#L1609"},{"t":"core/git.go:gitLogReachesShallowBoundary","u":"https://github.com/dagger/dagger/blob/a96196e9d8ba4a8ebc77bc31d7bbac188469e84b/core/git.go#L1521"}],"what":"Local refs are compared through a temporary bare repository whose alternates point at the mounted read-only object stores: nothing is copied or fetched. Unfiltered short logs fetch only limit generations and retry with full history if a boundary is uneven; path filters and base exclusions keep full history.","effect":"After a workspace commit, ahead/behind comparisons no longer re-copy the whole history (TestWorkspaceCommittedHistoryDoesNotFetch).","code":["GitRef.log(limit, paths, base)","  unfiltered: fetch limit generations; uneven shallow boundary → retry with full history","  paths/base: ref.mount(depth 0) → git log …    # remote: --unshallow the mirror, under its lock","GitRef.commonAncestor(other)","  mountRefs(a, b):","    same repository → mount once","    local refs → alternates view over the mounted object stores (no fetch)","    else refJoin: tmp repo; fetch each ref from its backend (each under its own mirror lock)","  git merge-base"],"source":"pr-description","sha":"a96196e"},{"pr":"14400","where":[{"t":"core/git_history_native.go:mountOwnedShallowHistory","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_history_native.go#L26"},{"t":"core/git_history_native.go:mountRefsWithLocalDonor","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_history_native.go#L185"},{"t":"core/git_history_native.go:nativeParentHistoryRefs","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_history_native.go#L343"},{"t":"core/git_local_history.go:HydrateGitRepository","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_local_history.go#L126"}],"what":"Joined reads first try proofs that need no remote: an owned shallow child against its anchor or descendants, a complete local donor that holds every commit, an owned child standing in for its exact remote parent. Only then refJoin. Owned shallow storage hydrates (__hydrateRepository) when a read crosses its boundary; it never truncates.","effect":"Ahead/behind against the remote parent works with the remote's service stopped (TestWorkspaceRemoteParentHistoryDoesNotFetch).","svg":"<svg viewBox='0 0 760 120' width='100%' font-family='sans-serif' font-size='11'><rect x='5' y='35' width='120' height='40' rx='8' fill='#1d2330'/><text x='65' y='59' text-anchor='middle' fill='#fff' font-weight='700'>mountRefs</text><rect x='140' y='35' width='140' height='40' rx='8' fill='#e2f6ee' stroke='#1f9d6b'/><text x='148' y='52'>owned shallow</text><text x='148' y='67'>vs anchor</text><rect x='295' y='35' width='140' height='40' rx='8' fill='#e2f6ee' stroke='#1f9d6b'/><text x='303' y='52'>complete local</text><text x='303' y='67'>donor (alternates)</text><rect x='450' y='35' width='140' height='40' rx='8' fill='#e2f6ee' stroke='#1f9d6b'/><text x='458' y='52'>owned child for</text><text x='458' y='67'>its remote parent</text><rect x='605' y='35' width='150' height='40' rx='8' fill='#fde8e8' stroke='#d64545'/><text x='613' y='52'>refJoin: fetch each</text><text x='613' y='67'>ref (mirror locks)</text><path d='M125 55 H138 M280 55 H293 M435 55 H448 M590 55 H603' stroke='#d64545' stroke-width='2'/><text x='140' y='100' fill='#5b6475'>no fetch, no mirror lock ……………………………………………  last resort</text></svg>","code":["GitRef.log(limit, paths, base)","  unfiltered: fetch limit generations; uneven shallow boundary → retry with full history","  owned shallow storage: answer above the boundary; deeper → __hydrateRepository","  paths/base: ref.mount(depth 0) → git log …    # remote: --unshallow the mirror, under its lock","GitRef.commonAncestor(other)","  mountRefs(a, b):","    same repository → mount once","    local refs → alternates view over the mounted object stores (no fetch)","    owned shallow child vs its anchor/descendants → the child's store","    complete local donor holding every commit → alternates view (no fetch, no lock)","    owned child vs its exact remote parent → the child's objects","    else refJoin: tmp repo; fetch each ref from its backend (each under its own mirror lock)","  git merge-base"],"source":"pr-description","sha":"a34d69b"},{"pr":"14511","where":[{"t":"core/schema/git_remotes.go:gitSchema.contains","u":"https://github.com/dagger/dagger/blob/195b09187512b7e114f47048c773310701af87a7/core/schema/git_remotes.go#L93"},{"t":"core/git_remotes.go:containsWithFullHistory","u":"https://github.com/dagger/dagger/blob/195b09187512b7e114f47048c773310701af87a7/core/git_remotes.go#L272"}],"what":"Introduces GitRef.contains(other) for branch filtering (is the workspace commit in the remote default branch?). Missing history is fetched into temporary storage with the original access, only as deep as needed; unknown is an error.","effect":"With 32 unrelated shortened histories, two git history checks instead of 35.","code":["GitRef.log(limit, paths, base)","  unfiltered: fetch limit generations; uneven shallow boundary → retry with full history","  owned shallow storage: answer above the boundary; deeper → __hydrateRepository","  paths/base: ref.mount(depth 0) → git log …    # remote: --unshallow the mirror, under its lock","GitRef.commonAncestor(other) / contains(other)","  mountRefs(a, b):","    same repository → mount once","    local refs → alternates view over the mounted object stores (no fetch)","    owned shallow child vs its anchor/descendants → the child's store","    complete local donor holding every commit → alternates view (no fetch, no lock)","    owned child vs its exact remote parent → the child's objects","    else refJoin: tmp repo; fetch each ref from its backend (each under its own mirror lock)","  git merge-base [--is-ancestor]","  contains, history incomplete → containsWithFullHistory: fetch --unshallow only what is needed"],"source":"pr-description","sha":"195b091"},{"pr":"14576","where":[{"t":"core/git.go:refJoin","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git.go#L1968"},{"t":"core/git_remotes.go:containsWithFullHistory","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/git_remotes.go#L272"}],"what":"refJoin fetches commit IDs, which write no ref, so every fetch after the first negotiated from nothing and received the whole shared history again (two forks compared ⇒ history transferred twice). Each fetch now passes --negotiation-tip for the commits already joined; so does the --unshallow fetch in contains.","code":["GitRef.log(limit, paths, base)","  unfiltered: fetch limit generations; uneven shallow boundary → retry with full history","  owned shallow storage: answer above the boundary; deeper → __hydrateRepository","  paths/base: ref.mount(depth 0) → git log …    # remote: --unshallow the mirror, under its lock","GitRef.commonAncestor(other) / contains(other)","  mountRefs(a, b):","    same repository → mount once","    local refs → alternates view over the mounted object stores (no fetch)","    owned shallow child vs its anchor/descendants → the child's store","    complete local donor holding every commit → alternates view (no fetch, no lock)","    owned child vs its exact remote parent → the child's objects","    else refJoin: tmp repo; fetch each ref --negotiation-tip=<joined SHAs> (each under its own mirror lock)","  git merge-base [--is-ancestor]","  contains, history incomplete → containsWithFullHistory: fetch --unshallow --negotiation-tip=<joined SHAs>"],"source":"code","sha":"d8cf808"},{"pr":"base","where":[{"t":"core/git.go:GitRef.Log","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git.go#L1102"},{"t":"core/git.go:MergeBase","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git.go#L1068"},{"t":"core/git.go:mountRefs","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git.go#L1028"},{"t":"core/git.go:refJoin","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/git.go#L1153"}],"what":"log mounts the ref with full history (for a remote: --unshallow the mirror under its lock). Two refs from different repositories are joined in a scratch repository that fetches each one.","code":["GitRef.log(limit, paths, base)","  ref.mount(depth 0) → git log …                # remote: --unshallow the mirror, under its lock","GitRef.commonAncestor(other)","  mountRefs(a, b):","    same repository → mount once","    else refJoin: tmp repo; fetch each ref from its backend (each under its own mirror lock)","  git merge-base"],"source":"code","sha":"5ddd194"}]},"listing":{"title":"Ref listings (tags · branches)","short":"listings","tabs":[{"pr":"14147","where":[{"t":"core/schema/git.go","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go","n":"PerSessionInput"}],"what":"The repository result became shared across sessions and clients, but tags and branches move: listings are answered per session (d980a3d).","code":["GitRepository.tags(patterns) / branches(patterns)   # cache: per session","  remote = repo.LoadRemote()               # ls-remote, cached per session","  return remote.Filter(patterns).Tags() / .Branches()"],"source":"pr-description","sha":"40a74d0"},{"pr":"14433","where":[{"t":"core/schema/git.go:withUpstreamNames","u":"https://github.com/dagger/dagger/blob/e2af618b27b822685853b514ca92bc062252bfe1/core/schema/git.go#L2093"}],"what":"Owned storage also lists its Upstream's names (same patterns), so listings match what ref() accepts; an unreachable upstream fails the listing instead of truncating it.","code":["GitRepository.tags(patterns) / branches(patterns)   # cache: per session","  remote = repo.LoadRemote()               # ls-remote, cached per session","  local = remote.Filter(patterns).Tags() / .Branches()","  owned storage with Upstream: + Upstream's names (unreachable upstream → error)","  return union"],"source":"pr-description","sha":"e2af618"},{"pr":"base","where":[{"t":"core/schema/git.go:gitSchema.tags","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/git.go#L1255"},{"t":"core/schema/git.go:gitSchema.branches","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/schema/git.go#L1273"}],"what":"List the remote (session-cached ls-remote) and filter by glob patterns.","code":["GitRepository.tags(patterns) / branches(patterns)","  remote = repo.LoadRemote()               # ls-remote, cached per session","  return remote.Filter(patterns).Tags() / .Branches()"],"source":"pr-description","sha":"5ddd194"}]},"merge":{"title":"Changeset merges (Changeset.withChangeset · withChangesets)","short":"changeset merge","tabs":[{"pr":"14466","where":[{"t":"core/changeset.go","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/changeset.go","n":"2094a4a"}],"what":"Merges keep their path computations and diffs proportional to the change (layer walks), instead of whole-tree walks of the base.","code":["Changeset.withChangeset(other, onConflict)   # withChangesets: octopus, FAIL/FAIL_EARLY only","  FAIL_EARLY: path conflicts → fail before merging (paths from layer walks)","  base = MergeBeforeDirectories(ours, theirs)","  COW scratch of base (withGitMergeWorkspace) → DirectoryMergeChangesetsLazy   # saved recipe","    git init; git add -A; commit 'base'          # an object for every base file","    branch per side: applyContent(diff); commit","    git merge (-X ours|theirs | markers); verify declared paths landed","    restore directories emptied by the merge","    rm .git","  return Changeset(before: base, after: scratch)"],"source":"pr-description","sha":"1850411"},{"pr":"14472","where":[{"t":"core/changeset.go:DirectoryMergeChangesetsLazy","u":"https://github.com/dagger/dagger/blob/9a2926b230aed0baf10e44c02603e0168e30cddf/core/changeset.go#L2425"}],"what":"Merges get a saved recipe; conflicts are reported where they are wrapped.","code":["Changeset.withChangeset(other, onConflict)   # withChangesets: octopus, FAIL/FAIL_EARLY only","  FAIL_EARLY: path conflicts → fail before merging","  base = MergeBeforeDirectories(ours, theirs)","  COW scratch of base (withGitMergeWorkspace) → DirectoryMergeChangesetsLazy   # saved recipe","    git init; git add -A; commit 'base'          # an object for every base file","    branch per side: applyContent(diff); commit","    git merge (-X ours|theirs | markers); verify declared paths landed","    rm .git","  return Changeset(before: base, after: scratch)"],"source":"pr-description","sha":"9a2926b"},{"pr":"14572","where":[{"t":"core/changeset.go:restorePrunedDirs","u":"https://github.com/dagger/dagger/blob/8bc7074fe3d83fb38b6a2c17f1dc631545dbea55/core/changeset.go#L1853"}],"what":"git prunes a directory when the merge removes its last tracked file; a generator removing one file deleted the whole top-level directory on export. Directories emptied by the merge are kept (dbc82c8).","code":["Changeset.withChangeset(other, onConflict)   # withChangesets: octopus, FAIL/FAIL_EARLY only","  FAIL_EARLY: path conflicts → fail before merging","  base = MergeBeforeDirectories(ours, theirs)","  COW scratch of base (withGitMergeWorkspace) → DirectoryMergeChangesetsLazy   # saved recipe","    git init; git add -A; commit 'base'          # an object for every base file","    branch per side: applyContent(diff); commit","    git merge (-X ours|theirs | markers); verify declared paths landed","    restore directories emptied by the merge","    rm .git","  return Changeset(before: base, after: scratch)"],"source":"pr-description","sha":"8bc7074"},{"pr":"14576","where":[{"t":"core/changeset.go:gitMergeChangesets","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset.go#L2159"},{"t":"core/changeset.go:newGitMergeScope","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset.go#L2557"},{"t":"core/changeset.go:initScopedGitRepo","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset.go#L2641"},{"t":"core/changeset.go:gitThrowawayConfig","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset.go#L2440"},{"t":"core/changeset.go:beginGitProfileOp","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/changeset.go#L2459"}],"what":"Two-way merges first build a scoped base: the same full tree, but with objects only where the merge can read or write (declared paths, diff entries, removed/added/replaced subtrees, control files); every other file is hashed with update-index --info-only and trees use --missing-ok (rename detection unchanged). Any failure except the merge's own conflict redoes it with the full base. Throwaway objects are uncompressed. Every git command is a git.<verb> wcprof op. The octopus merge keeps the full base.","effect":"9k-file slice: base 1.45 s → 0.6 s, 12.1k → 3.7k objects; full base 2.6 s → 1.3 s (uncompressed).","code":["Changeset.withChangeset(other, onConflict)   # withChangesets: octopus, FAIL/FAIL_EARLY only","  FAIL_EARLY: path conflicts → fail before merging (paths from layer walks)","  base = MergeBeforeDirectories(ours, theirs)","  COW scratch of base (withGitMergeWorkspace) → DirectoryMergeChangesetsLazy   # saved recipe","    scoped base: objects only in scope; others update-index --info-only; write-tree --missing-ok","      any failure but a conflict → redo with the full base (git.merge.scoped_fallback[…])","    full base: git init; git add -A; commit 'base' (core.compression=0)   # octopus: always","    branch per side: applyContent(diff); commit","    git merge (-X ours|theirs | markers); verify declared paths landed","    restore directories emptied by the merge","    rm .git","    wcprof: git.merge.<phase>, git.<verb> per command","  return Changeset(before: base, after: scratch)"],"source":"code","sha":"d8cf808"},{"pr":"base","where":[{"t":"core/changeset.go:gitMergeChangesets","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/changeset.go#L1681"},{"t":"core/changeset.go:gitOctopusMergeChangesets","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/changeset.go#L1744"}],"what":"Merge two (or, octopus, many) changesets on their common Before in a scratch git repository: commit the whole base with git add -A, apply each side on a branch, git merge with the requested strategy, verify every declared path landed (hardened by #14012), drop .git.","code":["Changeset.withChangeset(other, onConflict)   # withChangesets: octopus, FAIL/FAIL_EARLY only","  FAIL_EARLY: path conflicts → fail before merging","  base = MergeBeforeDirectories(ours, theirs)","  COW scratch of base (withGitMergeWorkspace):","    git init; git add -A; commit 'base'          # an object for every base file","    branch per side: applyContent(diff); commit","    git merge (-X ours|theirs | markers); verify declared paths landed","    rm .git","  return Changeset(before: base, after: scratch)"],"source":"pr-description","sha":"5ddd194"}]},"paths":{"title":"Changeset paths (Directory.changes · Changeset.addedPaths/modifiedPaths/removedPaths/isEmpty/diffStats)","short":"changeset paths","tabs":[{"pr":"14215","where":[{"t":"core/changeset_delta.go:collectChangesetDeltaBounded","u":"https://github.com/dagger/dagger/blob/0313dfedb934b4dcd1cc906c06d5a289c302212e/core/changeset_delta.go#L182"},{"t":"core/changeset.go:PathCountExceeds","u":"https://github.com/dagger/dagger/blob/0313dfedb934b4dcd1cc906c06d5a289c302212e/core/changeset.go#L208"}],"what":"Automatic previews ask whether a changeset exceeds a budget; the walk now aborts as soon as it does, comparing inodes only, instead of finishing a 20 s walk of two unrelated trees.","code":["Directory.changes(from) → Changeset{Before: from, After: this}      # lazy","Changeset.addedPaths / modifiedPaths / removedPaths / isEmpty → ComputePaths","  mount Before and After","  fsdiff.WalkChanges(Before, After)          # double walk; inode, then content","PathCountExceeds(limit): same walk, aborted past the budget (inode-only)","diffStats: git diff --numstat on the changed paths"],"source":"pr-description","sha":"0313dfe"},{"pr":"14466","where":[{"t":"core/changeset.go:withMountedDirs","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/changeset.go#L389"},{"t":"core/changeset.go:changesetLayers","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/changeset.go#L448"},{"t":"core/changeset_delta.go:recordChangesetWalk","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/core/changeset_delta.go#L226"},{"t":"engine/snapshots/fsdiff/overlay_layers_linux.go:GetLayerDelta","u":"https://github.com/dagger/dagger/blob/18504114ce9008963885f57a3d98176a08112849/engine/snapshots/fsdiff/overlay_layers_linux.go#L46"}],"what":"When After's snapshot is Before's layers plus more (or both are siblings over one ancestor), only those layers can hold differences: walk them, resolving each path in the merged views. Otherwise the double walk. The walk taken is recorded.","effect":"One-file edit on a 5,000-file / 22 MB workspace used to cost ~40 ms per path computation plus whole-tree walks; this makes it proportional to the change.","code":["Directory.changes(from) → Changeset{Before: from, After: this}      # lazy","Changeset.addedPaths / modifiedPaths / removedPaths / isEmpty → ComputePaths","  mount Before and After","  After = Before + layers (or siblings over a common ancestor)? → walk only those layers","  else fsdiff.WalkChanges(Before, After)     # double walk; inode, then content","  attr dagger.changeset.paths.walk = layers | trees","PathCountExceeds(limit): same walk, aborted past the budget (inode-only)","diffStats: git diff --numstat on the changed paths"],"source":"pr-description","sha":"1850411"},{"pr":"base","where":[{"t":"core/changeset.go:ComputePaths","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/changeset.go#L160"},{"t":"core/changeset_delta.go:collectChangesetDelta","u":"https://github.com/dagger/dagger/blob/5ddd1941220d4a0345ac521ce06a9590a08b2631/core/changeset_delta.go#L164"}],"what":"A changeset is lazy; its paths are computed by mounting both directories and double-walking them (inode first, then content for distinct files whose stat matches), since #13615 replaced a full-content git diff.","code":["Directory.changes(from) → Changeset{Before: from, After: this}      # lazy","Changeset.addedPaths / modifiedPaths / removedPaths / isEmpty → ComputePaths","  mount Before and After","  fsdiff.WalkChanges(Before, After)          # double walk; inode, then content","diffStats: git diff --numstat on the changed paths"],"source":"pr-description","sha":"5ddd194"}]},"pull":{"title":"Pulling commits (Workspace.withCommitsFrom · compareCommitsFrom)","short":"pull","tabs":[{"pr":"14147","where":[{"t":"core/schema/workspace_pull.go:withCommitsFrom","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_pull.go#L135"},{"t":"core/schema/workspace_pull.go:computeWorkspacePull","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_pull.go#L170"},{"t":"core/workspace_pull.go:WorkspacePullCommits","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/workspace_pull.go#L92"},{"t":"core/workspace_pull.go:foldWorkspacePull","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/workspace_pull.go#L266"}],"what":"Introduced: integrate a frozen source workspace's commits, fast-forwarding when the selection includes every new ancestor and cherry-picking oldest first otherwise; picked/redundant commits are skipped (ancestry, patch-id, origin trailers); conflicts fail. All writes happen in a COW scratch copy of the receiver's retained checkout.","code":["Workspace.withCommitsFrom(source, commits, maxCommits)    # compareCommitsFrom: same fold, apply = false","  dir = __pullDirectory(…)","    base = receiver.git.__checkout                       # full retained checkout","    COW scratch of base:","      fetch source HEAD from its repository's mount","      apply receiver's uncommitted; add -A; commit dirty snapshot; reset --hard","      fold: fast-forward (reset --hard tip) | cherry-pick oldest first (patch-id / origin dedupe)","      merge-tree dirty onto new HEAD; read-tree --reset -u","  repo = receiver.head.repo.withContents(dir)","  return repo.head.asWorkspace.withChanges(repo.uncommitted)"],"source":"code","sha":"40a74d0"},{"pr":"14472","where":[{"t":"core/workspace_pull.go:DirectoryWorkspacePullLazy","u":"https://github.com/dagger/dagger/blob/9a2926b230aed0baf10e44c02603e0168e30cddf/core/workspace_pull.go#L630"}],"what":"__pullDirectory gets a saved recipe (13458a9): commit identity and dates come from the source commits and options, so a rerun reproduces the same history.","code":["Workspace.withCommitsFrom(source, commits, maxCommits)    # compareCommitsFrom: same fold, apply = false","  dir = __pullDirectory(…) → DirectoryWorkspacePullLazy   # saved recipe","    base = receiver.git.__checkout                       # full retained checkout","    COW scratch of base:","      fetch source HEAD from its repository's mount","      apply receiver's uncommitted; add -A; commit dirty snapshot; reset --hard","      fold: fast-forward (reset --hard tip) | cherry-pick oldest first (patch-id / origin dedupe)","      merge-tree dirty onto new HEAD; read-tree --reset -u","  repo = receiver.head.repo.withContents(dir)","  return repo.head.asWorkspace.withChanges(repo.uncommitted)"],"source":"code","sha":"9a2926b"},{"pr":"14576","where":[{"t":"core/workspace_pull.go:WorkspacePullCommits","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/workspace_pull.go#L98"},{"t":"core/workspace_pull.go:refreshWorkspacePullIndex","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/workspace_pull.go#L250"},{"t":"core/schema/workspace_pull.go:pullRepository","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/schema/workspace_pull.go#L225"},{"t":"core/schema/workspace_pull.go:pullCheckoutParent","u":"https://github.com/dagger/dagger/blob/d8cf808035b1d1e2052022c987d0e58545e3c609/core/schema/workspace_pull.go#L270"}],"what":"The scratch checkout has a detached HEAD and no refs, so the fetch negotiated from nothing and re-received the whole history; it now negotiates from HEAD. The retained index has no stat data, so add -A re-hashed (and copied up) everything and reset rewrote every file; the index is refreshed first, and a clean receiver skips the dirty snapshot entirely. The pulled storage is opened via a new persisted __pullRepository that records the receiver's HEAD as CheckoutBase, so the new HEAD's trees are deltas. Phases are traced (git.pull.*).","effect":"~5 s per pull fetch on dagger/dagger; Workspace.__pullDirectory self time 125 s → 42 s on a cold resume; 23 full checkouts (~107 s) of pulled HEADs removed.","code":["Workspace.withCommitsFrom(source, commits, maxCommits)    # compareCommitsFrom: same fold, apply = false","  dir = __pullDirectory(…) → DirectoryWorkspacePullLazy   # saved recipe","    base = receiver.git.__checkout                       # local HEAD: COW delta / wipe","    COW scratch of base:","      fetch source HEAD from its repository's mount --negotiation-tip=HEAD","      update-index --refresh                             # stat-less retained index","      clean? dirty snapshot = base tree (skip apply/add/reset)","      apply receiver's uncommitted; add -A; commit dirty snapshot; reset --hard","      fold: fast-forward (reset --hard tip) | cherry-pick oldest first (patch-id / origin dedupe)","      merge-tree dirty onto new HEAD; read-tree --reset -u","      wcprof: git.pull.fetch · refresh · dirty[clean|snapshot] · fold · merge","  repo = __pullRepository: withContents(dir) + CheckoutBase = receiver HEAD","  return repo.head.asWorkspace.withChanges(repo.uncommitted)"],"source":"code","sha":"d8cf808"}]},"push":{"title":"Pushing (GitRef.push)","short":"push","tabs":[{"pr":"14147","where":[{"t":"core/git_push.go:GitRef.Push","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/git_push.go#L66"},{"t":"core/schema/git_push.go","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git_push.go"}],"what":"Introduced: push a ref's history with the destination's credentials, after owner approval, with fast-forward checks or an explicit lease. History is copied into a disposable repository first, so checkout config, hooks and source credentials cannot affect the push. Each call pushes; the receipt can be replayed without pushing.","code":["GitRef.push(to, remote, branch, expectedRemoteSHA)      # DoNotCache, NotReplayable","  destination = to | registered remote | origin push routing","  AuthorizeGitPush (owner approval; owner URL rewrites resolved first)","  scratch bare repo: fetch SHA:refs/da 73310701af87a7/core/git_local.go#L435"}],"what":"Introduced the read side for branch filtering: list configured remotes (URL rewrites applied by git) overlaid by registered ones, choose the default remote (sole → origin → the branch's upstream; frozen values keep the captured selection), and open a remote's repository with the caller's credentials or the source's existing capability for that exact URL.","code":["GitRepository.withRemote(name, url, pushUrl)        # persisted","  repo.Remotes = WithGitRemote(remotes, {name, url, pushUrl})","  written into checkouts' .git/config; origin routes push","GitRepository.remotes / remote(name)","  configured remotes (readGitConfigRemotes; git resolves rewrites) overlaid by registered ones","GitRepository.defaultRemote: sole → origin → branch upstream (frozen: captured selection) → null","GitRemote.repository: git(fetch URL) with caller credentials, or the source's capability for this exact URL"],"source":"pr-description","sha":"195b091"}]},"reset":{"title":"Resetting HEAD (Workspace.withReset)","short":"withReset","tabs":[{"pr":"14147","where":[{"t":"core/schema/workspace_reset.go:withReset","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/workspace_reset.go#L26"}],"what":"Introduced: move HEAD to a commit (mixed by default: the previous working tree stays pending; hard discards it). The target is materialized from the frozen workspace's retained checkout, whose fetched object database held exactly HEAD's history, so orphaned commits were simply absent.","code":["Workspace.withReset(commit, hard)","  frozen = freeze(receiver)","  base = frozen.git.__checkout","  sha = resolve commit (full or abbreviated SHA, ref name) in base's objects","  dir = base.asGit.ref(sha).tree(depth: 0)              # = __fullCheckout of the target","  W = frozen.head.repo.withContents(dir).head.asWorkspace","  !hard: remaining = (frozen root − .git).changes(from: W root); W = W.withChanges(remaining)" = frozen.head.repo.withContents(dir).head.asWorkspace","  !hard: remaining = (frozen root − .git).changes(from: W root); W = W.withChanges(remaining)","  return W + workspace metadata"],"source":"code","sha":"d8cf808"}]},"resolve":{"title":"Ref resolution (head · ref · branch · tag · commit · latest)","short":"ref resolution","tabs":[{"pr":"14034","where":[{"t":"core/git.go:SelectGitRefWithVersionQuery","u":"https://github.com/dagger/dagger/blob/3735c8fa4ed918a90f26ad3166f5f74db338e4b6/core/git.go#L105"},{"t":"core/schema/git.go:gitSchema.latest","u":"https://github.com/dagger/dagger/blob/3735c8fa4ed918a90f26ad3166f5f74db338e4b6/core/schema/git.go#L2304"}],"what":"latest gains an optional SemVer version query: the greatest matching stable release (or a requested prerelease channel), checking tags first and then branches; the lock stores the selected ref and commit.","code":["GitRepository.ref(name)                    # head · branch · tag · commit share this path","  pin = workspace lock (git.ref, repo url, name)? → use the pinned SHA","  remote = repo.LoadRemote()               # remote: ls-remote, cached per session","                                            # local: ls-remote file://<gitdir>","  ref = remote.Lookup(name)                # strict: branch | tag | full SHA","  write lock entry","  return gitRefResult(ref)                 # content digest: url + SHA + discard flag","latest(version): SelectGitRefWithVersionQuery → matching tags, then branches; lock stores ref + commit"],"source":"pr-description","sha":"3735c8f"},{"pr":"14085","where":[{"t":"core/schema/git.go:gitLockInputs","u":"https://github.com/dagger/dagger/blob/cc94daf8d86a21247b9c5ee770df630f53432166/core/schema/git.go#L1110"}],"what":"Lock entries for git-latest and git-sha are keyed by a scheme-less host/path identity, so HTTPS, SSH and SCP-style spellings of one repository share a pin; old entries are normalized on the next write.","code":["GitRepository.ref(name)                    # head · branch · tag · commit share this path","  pin = workspace lock (git.ref, host/path identity, name)? → use the pinned SHA","  remote = repo.LoadRemote()               # remote: ls-remote, cached per session","                                            # local: ls-remote file://<gitdir>","  ref = remote.Lookup(name)                # strict: branch | tag | full SHA","  write lock entry","  return gitRefResult(ref)                 # content digest: url + SHA + discard flag","latest(version): SelectGitRefWithVersionQuery → matching tags, then branches; lock stores ref + commit"],"source":"pr-description","sha":"cc94daf"},{"pr":"14147","where":[{"t":"core/schema/git.go:gitLockScopedInput","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/schema/git.go#L1032"},{"t":"core/git.go:GitRepository.ResolveShortSHA","u":"https://github.com/dagger/dagger/blob/40a74d06ffe6b18d6cac020a1e3a7b007ebb7f19/core/git.go#L403"}],"what":"Abbreviated commit SHAs resolve against locally available objects (1aa7f22). Lock-consulting lookups are cached per client, while full-SHA lookups never consult the lock and stay shared engine-wide, which is how snapshots pin their refs (4e8f4d1).","code":["GitRepository.ref(name)                    # head · branch · tag · commit share this path","  # cache: per client when the lock is consulted; full SHAs shared","  pin = workspace lock (git.ref, host/path identity, name)? → use the pinned SHA","  remote = repo.LoadRemote()               # remote: ls-remote, cached per session","                                            # local: ls-remote file://<gitdir>","  abbreviated SHA → ResolveShortSHA (fetched objects only)","  ref = remote.Lookup(name)                # strict: branch | tag | full SHA","  write lock entry","  return gitRefResult(ref)                 # content digest: url + SHA + discard flag","latest(version): SelectGitRefWithVersionQuery → matching tags, then branches; lock stores ref + commit"],"source":"p s exactly as before (same lock pin); the walk is deterministic, so the expression gets no lock entry. Remote repositories fetch history down to the walk's depth and retry with full history when a parent is missing.","code":["GitRepository.ref(name)                    # head · branch · tag · commit share this path","  # cache: per client when the lock is consulted; full SHAs shared","  name~N / name^N → resolve base as below, then WalkRevision (remote: fetch walk depth, retry full)","  pin = workspace lock (git.ref, host/path identity, name)? → use the pinned SHA","  remote = repo.LoadRemote()               # remote: ls-remote, cached per session","                                            # local: ls-remote file://<gitdir>","  abbreviated SHA → ResolveShortSHA (fetched objects only)","  ref = remote.Lookup(name)                # strict: branch | tag | full SHA","  write lock entry","  return select __resolvedRef(name, SHA)    # persisted; digest: url + SHA + auth handles","latest(version): SelectGitRefWithVersionQuery → matching tags, then branches; lock stores ref + commit"],"source":"pr-description","sha":"cf813ea"},{"pr":"14403","where":[{"t":"core/schema/git.go","u":"https://github.com/dagger/dagger/blob/9ace10865a4e09e10fc29dfcb2a5b53b0d62365e/core/schema/git.go","n":"noLock args"}],"what":"noLock on ref/branch/tag/head/latest skips both lockfile reads and writes, for callers that need the live upstream value without consuming or changing the workspace pin.","code":["GitRepository.ref(name, noLock)            # head · branch · tag · commit share this path","  # cache: per client when the lock is consulted; full SHAs shared","  name~N / name^N → resolve base as below, then WalkRevision (remote: fetch walk depth, retry full)","  noLock: skip lock read and write","  pin = workspace lock (git.ref, host/path identity, name)? → use the pinned SHA","  remote = repo.LoadRemote()               # remote: ls-remote, cached per session","
