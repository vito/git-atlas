    if (t.notes) h += '<div class="notes">' + esc(t.notes) + '</div>';
    h += '<div class="where">' + t.where.map(ptrHTML).join('') + '</div>';
    if (t.svg) h += '<div class="svgbox">' + t.svg + '</div>';
    if (t.code.length) {
      h += '<div class="modes">pseudocode: <a href="#" data-mode="diff" class="' + (mode === 'diff' ? 'sel' : '') + '">diff vs previous tab</a><a href="#" data-mode="full" class="' + (mode === 'full' ? 'sel' : '') + '">full</a>' +
        (prevIdx >= 0 ? '<span>· compared with ' + esc(prLabel(PR[ts[prevIdx].pr])) + (!merged(p) && prevIdx !== si - 1 ? ' (' + esc(prLabel(p)) + ' is not merged, so it diffs against the newest merged tab)' : '') + '</span>' : '<span>· first tab</span>') + '</div>';
      h += codeHTML(prev, t.code, mode);
    }
    h += '</div>';
    return h;
  }

  // ---------- timeline ----------
  function implOrder() { return D.implOrder.filter(function (k) { return IMPL[k]; }); }
  function dotClass(p) { return isSel(p.id) ? 'dot hl' : p.state === 'base' ? 'dot b' : merged(p) ? 'dot' : 'dot u'; }
  function timelineView() {
    var ks = implOrder();
    var h = '<h1>Timeline: every PR on one axis</h1><p class="sub">Rows are PRs in merge order (unmerged PRs last); columns are implementation families (a family can back several public fields). A square marks a tab: that PR changed the family\'s implementation path. Highlighted PRs (top right) are colored. Click a square to open it.</p>';
    h += '<div class="legend"><span><i class="dot b"></i>baseline</span><span><i class="dot"></i>merged</span><span><i class="dot u"></i>unmerged</span><span>colored: highlighted</span></div>';
    h += '<div class="card" style="overflow:auto"><table class="grid"><tr><th>PR</th><th>merged</th>' + ks.map(function (k) {
      return '<th class="v" title="' + esc(IMPL[k].title) + '">' + esc(IMPL[k].short || IMPL[k].title) + '</th>';
    }).join('') + '<th>#</th></tr>';
    D.prs.forEach(function (p) {
      var cnt = 0;
      var cells = ks.map(function (k) {
        var has = IMPL[k].tabs.some(function (t) { return t.pr === p.id; });
        if (!has) return '<td class="c"></td>';
        cnt++;
        var first = apisOfImpl(k)[0];
        return '<td class="c"><a class="' + dotClass(p) + '"' + pcStyle(p) + ' title="' + esc(IMPL[k].title + ' · ' + prLabel(p)) + '" href="#' + esc(first ? first.id : '') + '/' + esc(p.id) + '"></a></td>';
      }).join('');
      h += '<tr class="' + (isSel(p.id) ? 'hl' : '') + '"' + pcStyle(p) + '><td style="white-space:nowrap">' + (p.url ? '<a href="' + esc(p.url) + '">' + esc(prLabel(p)) + '</a>' : esc(prLabel(p))) + ' <span style="color:#5b6475">' + esc(p.title.length > 58 ? p.title.slice(0, 56) + '…' : p.title) + '</span></td><td style="white-space:nowrap;color:#5b6475">' + esc(stateText(p)) + '</td>' + cells + '<td><b>' + cnt + '</b></td></tr>';
    });
    h += '</table></div>';
    h += '<h2>Families per PR, at a glance</h2><div class="card">' + D.prs.map(function (p) {
      var n = ks.filter(function (k) { return IMPL[k].tabs.some(function (t) { return t.pr === p.id; }); }).length;
      var w = Math.round(n / ks.length * 100);
      var col = isSel(p.id) ? p.color : merged(p) ? '#9aa3b5' : '#c9c5ba';
      return '<div style="display:grid;grid-template-columns:90px 1fr 40px;gap:10px;align-items:center;margin:4px 0;font-size:13px"><span>' + esc(prLabel(p)) + '</span><span style="background:#efece4;border-radius:99px;height:12px;overflow:hidden"><span style="display:block;height:12px;width:' + w + '%;background:' + esc(col) + '"></span></span><span>' + n + '</span></div>';
    }).join('') + '</div>';
    return h;
  }

  // ---------- matrix ----------
  var MSYM = { yes: '✓', partial: '◐', gap: '✗', na: '·' };
  function cellOf(row, c) { return row.cells[c.id] || { s: 'na', note: '' }; }
  function pending(v) { return v.req && PR[v.req] && !merged(PR[v.req]); }
  function matrixView() {
    var cols = D.matrixCols;
    var h = '<h1>Consistency matrix</h1><p class="sub">Rows are public fields; columns are mechanisms that exist somewhere in the git stack. Click a cell for its note, evidence and the commit it was judged at. Red ✗ marks a mechanism that is missing but plausibly applicable: the laggards. A dashed cell holds only once an unmerged PR lands. A colored ring means a highlighted PR changed that cell.</p>';
    h += '<div class="legend"><span><span class="cell yes">✓</span>applies</span><span><span class="cell partial">◐</span>partial</span><span><span class="cell gap">✗</span>missing but could</span><span><span class="cell pend">✓</span>only once an unmerged PR lands</span><span><span class="cell na">·</span>not applicable</span>' +
      '<span><a href="#" id="gaponly" class="chip">' + (matrixOnlyGaps ? 'show all rows' : 'show only rows with gaps') + '</a></span></div>';
    h += '<div class="card" style="overflow:auto"><table class="grid"><tr><th>field</th>' + cols.map(function (c) {
      return '<th class="v" title="' + esc(c.desc) + '">' + esc(c.name) + '</th>';
    }).join('') + '<th>gaps</th></tr>';
    var lastType = '';
    D.matrix.forEach(function (row, ri) {
      var gaps = 0;
      cols.forEach(function (c) { if (cellOf(row, c).s === 'gap') gaps++; });
      if (matrixOnlyGaps && !gaps) return;
      var a = API[row.api], type = row.api.split('.')[0];
      if (type !== lastType) { h += '<tr><td colspan="' + (cols.length + 2) + '" style="background:#f3f1ea;font-weight:700;font-size:12px">' + esc(type) + '</td></tr>'; lastType = type; }
      h += '<tr><td style="white-space:nowrap"><a class="ptr" href="#' + esc(row.api) + '">' + esc(a ? a.type + '.' + a.field : row.api) + '</a></td>' + cols.map(function (c, ci) {
        var v = cellOf(row, c), hp = firstSel(v.prs), pend = pending(v);
        var cls = 'cell ' + (pend ? 'pend' : v.s) + (hp ? ' hl' : '');
        var title = c.name + ': ' + (v.note || 'not applicable') + (pend ? ' [only once #' + v.req + ' lands]' : '');
        return '<td class="c"><a href="#" class="' + cls + '"' + pcStyle(hp) + ' data-note="' + ri + ':' + ci + '" title="' + esc(title) + '">' + MSYM[v.s] + '</a></td>';
      }).join('') + '<td><b style="color:' + (gaps ? 'var(--red)' : 'var(--muted)') + '">' + gaps + '</b></td></tr>';
    });
    h += '</table><div class="notebox" id="note">Click a cell to read why.</div></div>';
    h += '<h2>Columns</h2><div class="card"><table>' + cols.map(function (c) { return '<tr><td><b>' + esc(c.name) + '</b></td><td>' + esc(c.desc) + '</td></tr>'; }).join('') + '</table></div>';
    return h;
  }
  function matrixNote(key) {
    var parts = key.split(':'), row = D.matrix[+parts[0]], col = D.matrixCols[+parts[1]];
    var v = cellOf(row, col);
    var h = '<b>' + esc(row.api) + ' × ' + esc(col.name) + '</b> — <span class="cell ' + (pending(v) ? 'pend' : v.s) + '">' + MSYM[v.s] + '</span> ' + esc(v.note || 'Not applicable to this field.');
    if (pending(v)) h += '<div style="margin-top:6px">Holds only once ' + prChip(v.req) + ' lands.</div>';
    if (v.prs && v.prs.length) h += '<div style="margin-top:6px">Changed by ' + v.prs.map(function (id) { return prChip(id); }).join(' ') + '</div>';
    if (v.ev && v.ev.length) h += '<div class="where">' + v.ev.map(ptrHTML).join('') + '</div>';
    if (v.asof) h += '<div style="margin-top:6px;color:#5b6475;font-size:12.5px">judged at ' + esc(v.asof) + '</div>';
    return h;
  }

  // ---------- findings ----------
  function findingsView() {
    var kinds = { dup: 'duplicated mechanism', lag: 'lagging API', conflict: 'merge conflict / ordering', naming: 'naming / instrumentation' };
    var h = '<h1>Consolidation opportunities</h1><p class="sub">Concrete findings from the matrix and the per-PR histories. Sizes: S ≈ a day, M ≈ a few days, L ≈ a week or more. Risk is about behavior change, not effort. A finding is highlighted when a highlighted PR found it, fixed it, or is involved.</p>';
    h += D.findings.map(function (f, i) {
      var hp = firstSel([f.discovered_in, f.fixed_in].concat(f.prs || []));
      return '<div class="finding ' + esc(f.kind) + (hp ? ' hl' : '') + (f.status !== 'open' ? ' closed' : '') + '" id="' + esc(f.id) + '"' + pcStyle(hp) + '><h3>' + (i + 1) + '. ' + esc(f.title) + '</h3>' +
        '<div class="tags"><span class="pill s-' + esc(f.status) + '">' + esc(f.status) + '</span>' + (f.fixed_in ? prChip(f.fixed_in, 'fixed in ') : '') + prChip(f.discovered_in, 'found in ') +
        '<span class="pill k-' + esc(f.kind) + '">' + esc(kinds[f.kind] || f.kind) + '</span><span class="pill">size ' + esc(f.size) + '</span><span class="pill">risk ' + esc(f.risk) + '</span>' +
        (f.apis || []).map(function (a) { return '<a class="chip" href="#' + esc(a) + '">' + esc(a) + '</a>'; }).join('') + '</div>' +
        ((f.prs || []).length ? '<div class="tags">involves ' + f.prs.map(function (id) { return prChip(id); }).join(' ') + '</div>' : '') +
        '<div class="what">' + esc(f.body) + '</div>' +
        '<div style="margin-top:6px">' + f.pointers.map(function (p) { return '<div class="ptr">→ ' + ptrHTML(p) + '</div>'; }).join('') + '</div>' +
        (f.proposal ? '<div class="effect" style="border-color:var(--blue);background:var(--blue-soft)"><b>Proposal:</b> ' + esc(f.proposal) + '</div>' : '') + '</div>';
    }).join('');
    return h;
  }

  // ---------- compare ----------
  function compareView(aId, bId) {
    var opts = function (s) {
      return D.apis.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === s ? ' selected' : '') + '>' + esc(a.id) + '</option>'; }).join('');
    };
    var h = '<h1>Compare two fields side by side</h1><p class="sub">Rows are the PRs that touched either implementation, in merge order. Spot where one field picked up an optimization the other did not.</p>';
    h += '<div class="card">A: <select id="cmpA">' + opts(aId) + '</select> &nbsp; B: <select id="cmpB">' + opts(bId) + '</select></div>';
    var A = API[aId], B = API[bId];
    if (!A || !B) return h;
    var ta = tabsOf(A.impl), tb = tabsOf(B.impl), ids = {};
    ta.concat(tb).forEach(function (t) { ids[t.pr] = 1; });
    var prs = Object.keys(ids).map(function (k) { return PR[k]; }).sort(function (x, y) { return x.idx - y.idx; });
    function side(ts, api, p) {
      var t = ts.filter(function (x) { return x.pr === p.id; })[0];
      if (!t) return '<div style="color:#c4c0b4">—</div>';
      return '<div><a href="#' + esc(api.id) + '/' + esc(p.id) + '">open tab</a> · ' + esc(t.what.length > 260 ? t.what.slice(0, 258) + '…' : t.what) +
        (t.code.length ? '<details><summary>pseudocode</summary>' + codeHTML(null, t.code, 'full') + '</details>' : '') + '</div>';
    }
    h += '<div class="card"><div class="cmp"><div class="h">PR</div><div class="h">' + esc(aId) + (A.impl === B.impl ? ' (same implementation as B)' : '') + '</div><div class="h">' + esc(bId) + '</div>';
    prs.forEach(function (p) {
      h += '<div>' + prBadge(p) + '<br><small>' + esc(prLabel(p)) + '</small></div>' + side(ta, A, p) + side(tb, B, p);
    });
    h += '</div></div>';
    return h;
  }

  // ---------- glossary ----------
  function glossaryView() {
    var h = '<h1>Glossary</h1><p class="sub">Terms used across the tabs, the matrix and the findings.</p><div class="card"><dl class="gloss">';
    h += D.glossary.map(function (g) {
      return '<dt>' + ticks(g.term) + (g.pr ? ' ' + prChip(g.pr, 'since ') : '') + '</dt><dd>' + ticks(g.def) + '</dd>';
    }).join('');
    return h + '</dl></div>';
  }

  // ---------- about ----------
  function aboutView() {
    var m = D.meta, h = '<h1>About, sources and coverage</h1>';
    h += '<div class="card"><div class="what" style="white-space:pre-wrap">' + esc(m.about) + '</div>';
    h += '<p style="font-size:13px;color:#5b6475">Upstream: ' + esc(m.upstream.repo) + ' ' + esc(m.upstream.branch) + ' @ <code>' + esc(m.upstream.sha.slice(0, 7)) + '</code> (' + esc(m.upstream.date) + '). Cutoff: ' + esc(m.cutoff.label) + '.</p>';
    h += (m.links || []).map(function (l) { return '<div><a href="' + esc(l.url) + '">' + esc(l.title) + '</a></div>'; }).join('') + '</div>';
    var kinds = { uncovered: 'not yet covered', recheck: 'tabs predate the merge', moved: 'head moved' };
    h += '<h2>Coverage queue</h2><div class="card">' + (D.queue.length ? '<table>' + D.queue.map(function (q) {
      return '<tr><td><a href="https://github.com/' + esc(m.upstream.repo) + '/pull/' + esc(q.pr) + '">#' + esc(q.pr) + '</a></td><td>' + esc(kinds[q.kind] || q.kind) + (q.blocking ? '' : ' (advisory)') + '</td><td>' + esc(q.title) + (q.detail ? '<br><small style="color:#5b6475">' + esc(q.detail) + '</small>' : '') + '</td></tr>';
    }).join('') + '</table>' : 'Empty: every PR merged since the cutoff that touches a tracked path is covered or skipped.') + '</div>';
    h += '<h2>PRs with tabs</h2><div class="card"><table><tr><th>PR</th><th>state</th><th>summary</th><th>families</th></tr>' + D.prs.slice().reverse().map(function (p) {
      var fam = implOrder().filter(function (k) { return IMPL[k].tabs.some(function (t) { return t.pr === p.id; }); }).map(function (k) { return IMPL[k].short || IMPL[k].title; });
      return '<tr class="' + (isSel(p.id) ? 'hl' : '') + '"' + pcStyle(p) + '><td style="white-space:nowrap"><i class="sw" style="background:' + esc(p.color) + '"></i> ' + (p.url ? '<a href="' + esc(p.url) + '">' + esc(prLabel(p)) + '</a>' : esc(prLabel(p))) + '</td><td style="white-space:nowrap">' + esc(stateText(p)) + '<br><small style="color:#5b6475">' + esc(p.sha || '') + '</small></td><td><b>' + esc(p.title) + '</b><br>' + esc(p.summary) +
        (p.why ? '<br><i>Why:</i> ' + esc(p.why) : '') + (p.effects ? '<br><small style="color:#14704c;white-space:pre-wrap">' + esc(p.effects) + '</small>' : '') + '</td><td style="font-size:12px">' + esc(fam.join(', ')) + '</td></tr>';
    }).join('') + '</table></div>';
    h += '<h2>Skipped PRs (touched tracked paths, no change to a public field\'s implementation path)</h2><div class="card"><table>' + D.skipped.map(function (s) {
      return '<tr><td><a href="https://github.com/' + esc(m.upstream.repo) + '/pull/' + esc(s.pr) + '">#' + esc(s.pr) + '</a></td><td>' + esc(s.title) + '</td><td style="color:#5b6475">' + esc(s.why) + '</td></tr>';
    }).join('') + '</table></div>';
    return h;
  }

  // ---------- PR selection ----------
  function sameSet(a, b) { return a.length === b.length && a.every(function (x) { return b.indexOf(x) >= 0; }); }
  function hlSuffix() {
    var ids = selIds();
    return sameSet(ids, DEFAULT_SEL) ? '' : '?hl=' + ids.join(',');
  }
  function setSelection(ids) {
    sel = {};
    (ids || []).forEach(function (id) { if (PR[id]) sel[id] = true; });
  }
  function prMenuHTML(q) {
    q = (q || '').toLowerCase();
    return D.prs.slice().reverse().filter(function (p) {
      return !q || (p.id + ' ' + p.title + ' ' + p.state).toLowerCase().indexOf(q) >= 0;
    }).map(function (p) {
      return '<label class="pri"><input type="checkbox" data-pr="' + esc(p.id) + '"' + (isSel(p.id) ? ' checked' : '') + '><i class="sw" style="background:' + esc(p.color) + '"></i><b>' + esc(prLabel(p)) + '</b><span class="t" title="' + esc(p.title) + '">' + esc(p.title) + '</span><span class="st st-' + esc(p.state) + '">' + esc(p.state === 'merged' ? p.date : p.state) + '</span></label>';
    }).join('');
  }
  function swatchesHTML() {
    var ids = selIds();
    if (!ids.length) return '<span style="color:#8a8f99;font-weight:400">none</span>';
    return ids.map(function (id) { return '<i class="sw" title="' + esc(prLabel(PR[id])) + '" style="background:' + esc(PR[id].color) + '"></i>'; }).join('');
  }

  // ---------- routing ----------
  function parseHash(hash) {
    var h = decodeURIComponent((hash || '').replace(/^#/, ''));
    var qi = h.indexOf('?'), hl = null;
    if (qi >= 0) {
      var m = /(?:^|&)hl=([^&]*)/.exec(h.slice(qi + 1));
      if (m) hl = m[1] ? m[1].split(',') : [];
      h = h.slice(0, qi);
    }
    var r;
    if (!h) r = { page: 'apis', api: D.defaultApi };
    else if (h === 'timeline' || h === 'matrix' || h === 'findings' || h === 'about' || h === 'glossary') r = { page: h };
    else if (h.indexOf('compare') === 0) {
      var ab = h.replace(/^compare=?/, '').split(',');
      r = { page: 'compare', a: ab[0] || D.defaultApi, b: ab[1] || 'GitRepository.withBundle' };
    } else {
      var parts = h.split('/');
      var api = API[parts[0]] ? parts[0] : D.aliases[parts[0]] || D.defaultApi;
      r = { page: 'apis', api: api, pr: parts[1] };
    }
    r.hl = hl;
    return r;
  }
  function render(hash) {
    var r = parseHash(hash);
    setSelection(r.hl === null ? DEFAULT_SEL : r.hl);
    var html;
    if (r.page === 'timeline') html = timelineView();
    else if (r.page === 'matrix') html = matrixView();
    else if (r.page === 'findings') html = findingsView();
    else if (r.page === 'about') html = aboutView();
    else if (r.page === 'glossary') html = glossaryView();
    else if (r.page === 'compare') html = compareView(r.a, r.b);
    else html = apiView(r.api, r.pr);
    return { route: r, html: withHL(html) };
  }
  // Carry the selection through every internal link.
  function withHL(html) {
    var s = hlSuffix();
    if (!s) return html;
    return html.replace(/href="#([^"?]+)"/g, function (m, r) { return 'href="#' + r + s + '"'; });
  }
  function routeHash(r) {
    if (r.page === 'apis') return '#' + r.api + (r.pr ? '/' + r.pr : '');
    if (r.page === 'compare') return '#compare=' + r.a + ',' + r.b;
    return '#' + r.page;
  }
  var hasDOM = typeof document !== 'undefined' && document.getElementById && document.getElementById('view');
  function paint() {
    var res = render(location.hash);
    document.getElementById('view').innerHTML = res.html;
    var q = document.getElementById('q');
    document.getElementById('list').innerHTML = withHL(listHTML(q ? q.value : '', res.route.page === 'apis' ? res.route.api : null));
    var pages = document.querySelectorAll('.topbar a.page'), s = hlSuffix();
    for (var i = 0; i < pages.length; i++) {
      var base = pages[i].getAttribute('data-href');
      pages[i].setAttribute('href', base === '#' ? (s ? '#' + D.defaultApi + s : '#') : base + s);
      pages[i].className = 'page' + (pages[i].getAttribute('data-page') === res.route.page ? ' sel' : '');
    }
    document.getElementById('prsws').innerHTML = swatchesHTML();
    document.getElementById('prlist').innerHTML = prMenuHTML(document.getElementById('prq').value);
    var main = document.getElementById('main');
    if (main && main.scrollTo && res.route.page !== 'apis') main.scrollTo(0, 0);
  }
  function applySelection(ids) {
    setSelection(ids);
    var r = parseHash(location.hash);
    location.hash = routeHash(r) + hlSuffix();
    paint(); // hashchange may not fire when only the default selection changed
  }
  if (hasDOM) {
    window.addEventListener('hashchange', paint);
    document.getElementById('q').addEventListener('input', function () {
      var r = parseHash(location.hash);
      document.getElementById('list').innerHTML = withHL(listHTML(this.value, r.page === 'apis' ? r.api : null));
    });
    var menu = document.getElementById('prmenu'), btn = document.getElementById('prbtn');
    btn.addEventListener('click', function () {
      menu.hidden = !menu.hidden;
      btn.setAttribute('aria-expanded', String(!menu.hidden));
      if (!menu.hidden) document.getElementById('prq').focus();
    });
    document.addEventListener('click', function (e) {
      if (!menu.hidden && !document.getElementById('prsel').contains(e.target)) { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
    });
    document.getElementById('prq').addEventListener('input', function () {
      document.getElementById('prlist').innerHTML = prMenuHTML(this.value);
    });
    document.getElementById('prlist').addEventListener('change', function (e) {
      var id = e.target && e.target.getAttribute('data-pr');
      if (!id) return;
      var ids = selIds().filter(function (x) { return x !== id; });
      if (e.target.checked) ids.push(id);
      applySelection(ids);
    });
    menu.querySelector('.prtools').addEventListener('click', function (e) {
      var k = e.target && e.target.getAttribute('data-hl');
      if (!k) return;
      e.preventDefault();
      applySelection(k === 'open' ? DEFAULT_SEL : k === 'all' ? D.prs.map(function (p) { return p.id; }) : []);
    });
    document.getElementById('view').addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.getAttribute && t.getAttribute('data-mode')) { e.preventDefault(); mode = t.getAttribute('data-mode'); paint(); return; }
      if (t && t.id === 'gaponly') { e.preventDefault(); matrixOnlyGaps = !matrixOnlyGaps; paint(); return; }
      if (t && t.getAttribute && t.getAttribute('data-note')) { e.preventDefault(); document.getElementById('note').innerHTML = withHL(matrixNote(t.getAttribute('data-note'))); }
    });
    document.getElementById('view').addEventListener('change', function (e) {
      if (e.target && (e.target.id === 'cmpA' || e.target.id === 'cmpB')) {
        location.hash = '#compare=' + document.getElementById('cmpA').value + ',' + document.getElementById('cmpB').value + hlSuffix();
      }
    });
    paint();
  }
  // exposed for testing
  if (typeof window !== 'undefined') {
    window.GitEvo = { data: D, render: render, apiView: apiView, listHTML: listHTML, matrixNote: matrixNote, tabsOf: tabsOf, diffLines: diffLines,
      parseHash: parseHash, selection: selIds, setSelection: setSelection, applySelection: applySelection, defaultSelection: DEFAULT_SEL };
  }
})();
</script>
</body>
</html>
