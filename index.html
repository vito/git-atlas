<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dagger git APIs: implementation atlas</title>
<style>
:root{
  --bg:#f7f6f2; --paper:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#e3e1da;
  --blue:#2f6fed; --blue-soft:#e7efff; --green:#1f9d6b; --green-soft:#e2f6ee;
  --amber:#d98a00; --amber-soft:#fff3dc; --red:#d64545; --red-soft:#fde8e8;
  --violet:#7b4fd6; --violet-soft:#efe8ff; --teal:#0f8b96; --teal-soft:#dff4f5;
  --pc:#5b6475;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
code{font-family:var(--mono);font-size:.88em;background:#efece4;border-radius:5px;padding:.06em .32em}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:310px 1fr;height:100vh}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#f3f1ea}
aside .brand{padding:16px 16px 10px}
aside .brand b{display:block;font-size:15px}
aside .brand span{font-size:12px;color:var(--muted)}
aside input{margin:0 14px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
aside .list{overflow:auto;padding:0 8px 20px;flex:1}
aside h5{margin:14px 8px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
aside a.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-family:var(--mono);font-size:12.5px}
aside a.item:hover{background:#e8e5dc}
aside a.item.sel{background:var(--ink);color:#fff}
aside a.item .dots{display:flex;gap:2px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
aside a.item .dots i{width:6px;height:6px;border-radius:2px;background:#c9c5ba;display:inline-block}
aside a.item .dots i.u{background:#fff;border:1px dashed #9a958a}
main{overflow:auto;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(247,246,242,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar a.page{padding:6px 11px;border-radius:9px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13.5px}
.topbar a.page:hover{background:#ebe8df}
.topbar a.page.sel{background:var(--ink);color:#fff}
.topbar .sp{flex:1}
.prsel{position:relative}
.prsel > button{font:600 13px var(--sans);padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;gap:6px;align-items:center}
.prsel > button .sws{display:inline-flex;gap:2px}
.prmenu{position:absolute;right:0;top:calc(100% + 6px);width:520px;max-width:92vw;max-height:70vh;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(29,35,48,.18);z-index:20}
.prmenu[hidden]{display:none}
.prtools{display:flex;gap:6px;align-items:center;padding:10px;border-bottom:1px solid var(--line);font-size:12.5px}
.prtools input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.prtools a{padding:4px 8px;border-radius:7px;background:#efece4;color:var(--ink);text-decoration:none;font-weight:600}
.prlist{overflow:auto;padding:6px}
.pri{display:grid;grid-template-columns:18px 14px 62px 1fr auto;gap:7px;align-items:center;padding:5px 6px;border-radius:7px;font-size:12.5px;cursor:pointer}
.pri:hover{background:#f3f1ea}
.pri .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.st{font:700 10px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:#efece4;color:#4b5263;white-space:nowrap}
.st-open{background:#e7f5ec;color:#1f7a4f;border:1px dashed #1f9d6b}
.st-closed{background:#f1f0ed;color:#8a8f99;text-decoration:line-through}
.st-merged{background:var(--blue-soft);color:var(--blue)}
.st-unknown{background:#fde8e8;color:var(--red)}
.content{padding:22px 28px 80px;max-width:1300px}
h1{font-size:26px;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:20px;margin:26px 0 8px}
.sub{color:var(--muted);margin:0 0 14px;max-width:960px}
.badge{display:inline-flex;gap:5px;align-items:center;font:700 10.5px/1 var(--sans);letter-spacing:.05em;padding:4px 7px;border-radius:6px;vertical-align:2px;white-space:nowrap;background:#e9e6dc;color:#4b5263}
.badge.hl{background:var(--pc);color:#fff}
.badge.u{border:1.5px dashed var(--pc);background:#fff;color:var(--ink)}
.badge.u.hl{background:var(--pc);color:#fff;border-color:#fff}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
pre.sig{font-family:var(--mono);font-size:12.5px;background:#1d2330;color:#e6e9f0;border-radius:12px;padding:14px 16px;overflow:auto;margin:10px 0}
pre.sig .k{color:#8fb4ff} pre.sig .t{color:#8fe3bd} pre.sig .f{color:#ffd28f} pre.sig .d{color:#9aa3b5}
.doc{color:#333b4a;max-width:960px;white-space:pre-wrap;font-size:14px}
details.docs{margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:8px;background:#ebe8df;color:var(--ink);text-decoration:none}
.chip:hover{background:#ddd9cd}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 0;border-bottom:2px solid var(--ink);padding-bottom:0}
.tab{border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:7px 11px 6px;font-size:12.5px;text-decoration:none;color:var(--ink);background:#efece4;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.tab small{color:var(--muted);font-size:10.5px}
.tab:hover{background:#e6e2d7}
.tab.sel{background:var(--ink);color:#fff;border-color:var(--ink)} .tab.sel small{color:#c9d1e4}
.tab.u{border:1.5px dashed #9a958a;border-bottom:0;background:#fbfaf7}
.tab.hl{border-color:var(--pc);box-shadow:inset 0 3px 0 var(--pc)}
.tab.hl.sel{background:var(--pc);border-color:var(--pc);color:#fff} .tab.hl.sel small{color:rgba(255,255,255,.85)}
.tab.base{background:#e4e1d8}
.tabbody{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:16px 18px}
.tabbody.hl{border-color:var(--pc);border-width:0 1.5px 1.5px}
.tabbody.u{border-style:dashed}
.meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.meta h3{margin:0;font-size:17px}
.meta .date{color:var(--muted);font-size:13px}
.grounding{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;font-size:12px}
.grounding span{padding:3px 7px;border-radius:6px;background:#efece4;color:#4b5263}
.grounding .code{background:var(--green-soft);color:#14704c}
.grounding .desc{background:var(--amber-soft);color:#8a5a00}
.what{max-width:960px}
.effect{border-left:4px solid var(--green);background:var(--green-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0;max-width:960px}
.notes{border-left:4px solid #9aa3b5;background:#f3f1ea;padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0;max-width:960px;font-size:13.5px}
.where{font-family:var(--mono);font-size:12px;color:var(--teal);margin:8px 0}
.where a,.where span{display:inline-block;margin-right:12px;color:var(--teal)}
.where small{color:var(--muted);font-family:var(--sans)}
.modes{display:flex;gap:6px;margin:10px 0 6px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.modes a{padding:3px 9px;border-radius:7px;text-decoration:none;color:var(--ink);background:#efece4;font-weight:600}
.modes a.sel{background:var(--ink);color:#fff}
pre.code{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:#fbfaf7;border:1px solid var(--line);border-radius:12px;padding:10px 0;overflow:auto;margin:6px 0}
pre.code .ln{display:block;padding:0 14px 0 30px;position:relative;white-space:pre}
pre.code .ln::before{content:" ";position:absolute;left:10px;color:var(--muted)}
pre.code .ln.add{background:#e2f6ee}
pre.code .ln.add::before{content:"+";color:var(--green);font-weight:700}
pre.code .ln.del{background:#fde8e8;color:#8a3a3a;text-decoration:line-through;text-decoration-color:rgba(214,69,69,.45)}
pre.code .ln.del::before{content:"−";color:var(--red);font-weight:700}
pre.code .cm{color:#8a8f99}
pre.code .ln.add .cm{color:#4f7a66}
.svgbox{margin:10px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:auto}
table{border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr.hl td{background:var(--pct)}
table.grid td.c{text-align:center;padding:4px 3px}
table.grid th.v{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.02em;text-transform:none;white-space:nowrap;padding:6px 3px;height:170px}
.cell{display:inline-block;width:22px;height:20px;border-radius:5px;font:700 11px/20px var(--sans);text-align:center;text-decoration:none}
.cell.yes{background:var(--green-soft);color:var(--green)}
.cell.partial{background:var(--amber-soft);color:#9a6200}
.cell.gap{background:var(--red-soft);color:var(--red);outline:1.5px solid var(--red)}
.cell.na{background:transparent;color:#c4c0b4}
.cell.pend{background:#fff;outline:1.5px dashed #8a8f99;color:#4b5263}
.cell.hl{box-shadow:0 0 0 2.5px var(--pc)}
.dot{display:inline-block;width:14px;height:14px;border-radius:4px;text-decoration:none;background:#9aa3b5}
.dot.b{background:#cfcabd} .dot.u{background:#fff;border:1.5px dashed #8a8f99}
.dot.hl{background:var(--pc);border:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center;margin:8px 0}
.legend>span{display:inline-flex;gap:5px;align-items:center}
.finding{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:12px 0}
.finding.conflict{border-left:5px solid var(--amber)} .finding.dup{border-left:5px solid var(--violet)} .finding.lag{border-left:5px solid var(--red)} .finding.naming{border-left:5px solid var(--teal)}
.finding.hl{box-shadow:0 0 0 2px var(--pc);background:var(--pct)}
.finding.closed{opacity:.7}
.finding h3{margin:0 0 6px;font-size:16px}
.finding .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}
.pill{display:inline-block;font:600 11.5px/1 var(--sans);padding:5px 8px;border-radius:999px;background:#ebe8df}
.pill.k-dup{background:var(--violet-soft);color:var(--violet)} .pill.k-lag{background:var(--red-soft);color:var(--red)} .pill.k-conflict{background:var(--amber-soft);color:#9a6200} .pill.k-naming{background:var(--teal-soft);color:var(--teal)}
.pill.s-open{background:#fff;border:1px solid var(--line)} .pill.s-fixed{background:var(--green-soft);color:var(--green)} .pill.s-wontfix{background:#efece4;color:#8a8f99}
.ptr{font-family:var(--mono);font-size:12px;color:var(--teal)}
.ptr a{color:var(--teal)}
.notebox{background:#fbfaf7;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px;min-height:40px}
.cmp{display:grid;grid-template-columns:150px 1fr 1fr;gap:0}
.cmp > div{border-bottom:1px solid var(--line);padding:8px}
.cmp .h{font-weight:700;background:#efece4}
details summary{cursor:pointer;color:var(--blue);font-size:12.5px}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
dl.gloss dt{font-weight:700;margin-top:12px}
dl.gloss dd{margin:2px 0 0 0;color:#333b4a;max-width:900px}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}aside{max-height:45vh}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><b>Git API atlas</b><span>public fields · one tab per PR that changed the implementation</span></div>
  <input id="q" type="search" placeholder="Filter fields (e.g. tree, pull, bundle)…" autocomplete="off">
  <div class="list" id="list"></div>
</aside>

    <div class="prsel" id="prsel">
      <button type="button" id="prbtn" aria-haspopup="true" aria-expanded="false">Highlight PRs <span class="sws" id="prsws"></span> ▾</button>
      <div class="prmenu" id="prmenu" hidden>
        <div class="prtools"><input id="prq" type="search" placeholder="Filter PRs…" autocomplete="off"><a href="#" data-hl="open">open</a><a href="#" data-hl="none">none</a><a href="#" data-hl="all">all</a></div>
        <div class="prlist" id="prlist"></div>
      </div>
    </div>
  </div>
  <div class="content" id="view"><p>Loading…</p></div>
</main>

agger/dagger/pull/14015","sha":"7ff4e8d","color":"#1f9d6b","summary":"Removes per-invocation costs of loading a module from a remote git ref, including a per-session cache of the remote visibility probe.","effects":"Query.git: Part of removing the per-invocation cost of a remote git-ref module source (the PR's write-up: hack/designs/git-ref-module-source-cost.md)."},{"id":"14085","title":"core: normalize Git lock identities","state":"merged","date":"2026-09-09","url":"https://github.com/dagger/dagger/pull/14085","sha":"cc94daf","color":"#0f8b96","summary":"Keys git lock entries by a scheme-less host/path identity, so HTTPS, SSH and SCP spellings of one repository share a pin."},{"id":"14170","title":"fix(git): retain mirror fetch negotiation tips","state":"merged","date":"2026-09-16","url":"https://github.com/dagger/dagger/pull/14170","sha":"245a7a2","color":"#e8590c","summary":"Keeps fetched SHAs pinned in the remote mirror so later fetches negotiate from them."},{"id":"14097","title":"fix: finish remote Git maintenance before releasing its mirror","state":"merged","date":"2026-09-17","url":"https://github.com/dagger/dagger/pull/14097","sha":"f510150","color":"#d64545","summary":"Finishes remote git maintenance before releasing the mirror lock."},{"id":"14147","title":"git: snapshotting and a ton of APIs","state":"merged","date":"2026-09-17","url":"https://github.com/dagger/dagger/pull/14147","sha":"40a74d0","color":"#8f5b2e","summary":"Introduces workspace Git snapshotting and the workspace Git APIs (snapshot, withCommit, withCommitsFrom, withReset, export, push, withContents, withRemote), and makes Query.git client-independent once its inputs are explicit."},{"id":"14227","title":"fix(changeset): export only declared changed paths","state":"merged","date":"2026-09-18","url":"https://github.com/dagger/dagger/pull/14227","sha":"4056f4a","color":"#1098ad","summary":"Changeset.export writes only the declared changed paths."},{"id":"14215","title":"agent: make workspa ","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git_bundle.go#L1010"}],"what":"Proposed: bundle creation from a remote copies the targets and base out of the mirror with one packGitClosure (one update-ref transaction), then runs git bundle create unlocked. An annotated tag still comes from origin, but its peeled commit's history is pack-copied from the mirror first under a temporary ref, so the origin fetch negotiates against it and transfers only the tag object; the temporary refs are deleted before bundling. The import side has the same shape as #14576's; the PR notes that whichever merges second keeps #14576's copy body and instrumentation.","code":["GitRepository.bundle(refs, base)                     # names resolved per session","  __bundleFile(pinned refs, base)                    # persisted","    mount source with targets + base (remote: mirror lock + fetch)","      local source: scratch borrows objects via alternates (no fetch)","      remote source: pack-objects closure of targets + base + annotated tags' peeled commits","        via alternate, one update-ref (fallback: fetch)","        annotated tag: fetch only the tag object from origin (haves = copied history); drop temp refs","      release lock","      git bundle create (detached HEAD preserved)       # unlocked","GitRepository.withBundle(bundle, prerequisiteRef)","  __withBundleDirectory → DirectoryGitBundleImportLazy   # lazy, persisted producer","    mount source with prerequisites (remote: mirror lock + depth-0 fetch)","      new bare repo; copy prerequisites (copyGitBundlePrerequisites)","    release source / mirror lock","    bundle verify; fetch bundle refs; pack-refs; write remotes   # unlocked","GitBundle.validate / refs / prerequisiteSHAs: parse and verify the header"],"source":"code","sha":"655c54e"},{"pr":"14224","where":[{"t":"core/git_bundle.go:DirectoryGitBundleImportLazy","u":"https://github.com/dagger/dagger/blob/9282dfa1271e1907a3e3af6dc211 tDirectory(args)                        # persisted private recipe","    tree = ref.tree(discardGitDir: true)","    applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree","    base = ref.asWorkspace.git.__checkout                  # full checkout with .git","    COW child of base: applyContent; stage; git commit (hooks off)","  repo = parent.repo.withContents(dir)","  return repo.head"],"source":"code","sha":"40a74d0"},{"pr":"14167","where":[{"t":"core/git_commit_remote.go:copyRemoteCommitBase","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git_commit_remote.go#L152","n":"branch"},{"t":"core/git_commit_remote.go:finishRemoteCommitBase","u":"https://github.com/dagger/dagger/blob/655c54e254e447548294bbff50734009e6376059/core/git_commit_remote.go#L182"}],"what":"Proposed: the commit-base promotion creates and mounts its snapshot before locking, holds the mirror only for the pack-objects copy (through the shared packGitClosure helper), and writes HEAD and remotes after the unlock.","code":["GitRef.withCommit(changes, message, date, author…)","  dir = __withCommitDirectory(args) → DirectoryGitCommitLazy   # saved recipe","    same-base provenance (Before = tree(discardGitDir) of this SHA, same repo recipe)?","      remote parent: storage = ref(SHA).__nativeCommitBase(depth 1)   # lock only for the pack-objects copy","        (depth 0: approved host donor PackCommit first, else the remote)","      native: COW child of repo storage; scratch bare repo, objects via alternate","        read-tree; stage only changed paths (sparse); write-tree; commit-tree","        copy new objects only; publish branch / detached HEAD","    else, or any failure:","    tree = ref.tree(discardGitDir: true)","    applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree","    base = ref.asWorkspace.git.__checkout                  # full checkout with .git","    COW child of base: applyContent; stage; git commit (hooks off)","  repo = __withCommitRepository: withContents(dir) + CheckoutBase{Parent, CommitSHA, Tree} + HistorySource + Upstream","  return repo.head"],"source":"code","sha":"655c54e"},{"pr":"14396","where":[{"t":"core/git_commit_create.go:GitCommitChangesetNative","u":"https://github.com/dagger/dagger/blob/801126f88b5796973715dc95fb144ad5ff34a228/core/git_commit_create.go#L272"},{"t":"core/git_commit_create.go:GitCommitChangesetNativeBase","u":"https://github.com/dagger/dagger/blob/801126f88b5796973715dc95fb144ad5ff34a228/core/git_commit_create.go#L144"},{"t":"core/git_commit_create.go:nativeFallback","u":"https://github.com/dagger/dagger/blob/801126f88b5796973715dc95fb144ad5ff34a228/core/git_commit_create.go#L199"}],"what":"Same-base commits are written natively: stage only the changed paths (plus their ancestor .gitattributes/.gitignore) in a private read-tree index over borrowed objects, write-tree, commit-tree, copy only new objects into a COW child of the parent storage, publish the branch or detached HEAD. Unsupported storage or gitlink edits fall back with fixed reason codes; any failure falls back; >64 overlay layers fall back.","effect":"12k-file / 98 MB repo, three one-file commits: median Workspace.withCommit 11.07 s → 4.59 s.","code":["GitRef.withCommit(changes, message, date, author…)","  dir = __withCommitDirectory(args)                        # persisted private recipe","    same-base provenance (Before = tree(discardGitDir) of this SHA, same repo recipe)?","      native: COW child of repo storage; scratch bare repo, objects via alternate","        read-tree; stage only changed paths (sparse); write-tree; commit-tree","        copy new objects only; publish branch / detached HEAD","    else, or any failure:","    tree = ref.tree(discardGitDir: true)","    applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree","    base = ref.asWorkspace.git.__checkout                  # full checkout with .git","    COW child of base: applyContent; stage; git commit (hooks off)","  repo = parent.repo.withContents(dir)","  return repo.head"],"source":"code","sha":"801126f"},{"pr":"14399","where":[{"t":"core/schema/git_commit_create.go:gitRefWithCommitRepository","u":"https://github.com/dagger/dagger/blob/2f9de2a0c9db28a0e166e9d09b56418bdeb1203a/core/schema/git_commit_create.go#L85"}],"what":"The committed repository is opened through a private, persisted __withCommitRepository recipe that records the exact parent as CheckoutBase, so the new HEAD's source tree is an incremental delta (see GitRef.tree).","code":["GitRef.withCommit(changes, message, date, author…)","  dir = __withCommitDirectory(args)                        # persisted private recipe","    same-base provenance (Before = tree(discardGitDir) of this SHA, same repo recipe)?","      native: COW child of repo storage; scratch bare repo, objects via alternate","        read-tree; stage only changed paths (sparse); write-tree; commit-tree","        copy new objects only; publish branch / detached HEAD","    else, or any failure:","    tree = ref.tree(discardGitDir: true)","    applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree","    base = ref.asWorkspace.git.__checkout                  # full checkout with .git","    COW child of base: applyContent; stage; git commit (hooks off)","  repo = __withCommitRepository: withContents(dir) + CheckoutBase{Parent, CommitSHA}","  return repo.head"],"source":"code","sha":"2f9de2a"},{"pr":"14400","where":[{"t":"core/git_commit_remote.go:nativeCommitRepository","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_commit_remote.go#L24"},{"t":"core/git_commit_remote.go:GitRemoteCommitBase","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_commit_remote.go#L52"},{"t":"core/git_commit_remote.go:packRemoteCommitBaseDepth","u":"https://github.com/dagger/dagger/blob/a34d69b2fcae77ca0d40c944ccfab8ff5e1c08ff/core/git_commit_remote.go#L116"}],"what":"Remote parents used to fall back to the full checkout and general merge for the first commit (~18 s on dagger/dagger). The pinned remote commit's closure is promoted once per exact recipe into owned storage (__nativeCommitBase(depth 1): pack-objects --revs from a read-only mirror mount under the lock), shared by reconciliation and commit. The result records HistorySource and the parent's pinned tree.","effect":"First commit on a remote-backed workspace no longer pays ~18 s for a full checkout + general merge.","code":["GitRef.withCommit(changes, message, date, author…)","  dir = __withCommitDirectory(args) → DirectoryGitCommitLazy   # saved recipe","    same-base provenance (Before = tree(discardGitDir) of this SHA, same repo recipe)?","      remote parent: storage = ref(SHA).__nativeCommitBase(depth 1)   # pack-objects closure, mirror lock","      native: COW child of repo storage; scratch bare repo, objects via alternate","        read-tree; stage only changed paths (sparse); write-tree; commit-tree","        copy new objects only; publish branch / detached HEAD","    else, or any failure:","    tree = ref.tree(discardGitDir: true)","    applied = tree.changes(from: changes.Before).withChangeset(changes, FAIL) vs tree","    base = ref.asWorkspace.git.__checkout                  # full checkout with .git","    COW child of base: applyContent; stage; git commit (hooks off)","  repo = __withCommitRepository: withContents(dir) + CheckoutBase{Parent, CommitSHA, Tree} + HistorySource","  return repo.head"],"source":"code","sha":"a34d69b"},{"pr":"14401","where":[{"t":"core/git_host_history.go:approvedHostCommitPack","u":"https://github.com/dagger/dagger/blob/913c0faee9fff2341cdacebe7df6a8d4c183d74f/core/git_host_history.go#L173"},{"t":"engine/session/git/git_pack_commit.go:PackCommit","u":"https://github.com/dagger/dagger/blob/913c0faee9fff2341cdacebe7df6a8d4c183d74f/engine/session/git/git_pack_commit.go#L26"}],"wh
